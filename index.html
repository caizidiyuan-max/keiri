// ---------- 店名の入力候補(2026-07-21 ユーザー指示) ----------
// 候補 = 学習ルール(rules)の店名 + 記帳済み(entries)の店名。表記ゆれ(空白・大小文字)は
// normalize で同一視して重複除去し、使用回数(ルールのcount+記帳の件数)の多い順に最大20件。
// datalist は render のたびに1個だけ生成し、承認待ちカード・編集フォームの全店名入力欄で共有する
function storeCandidates() {
  var byKey = {};
  function add(name, cnt) {
    var n = String(name || "").trim();
    var key = normalize(n);
    if (!key) return;
    if (!byKey[key]) byKey[key] = { name: n, count: 0 };
    byKey[key].count += cnt;
  }
  state.rules.forEach(function (r) {
    var c = Number(r && r.count);
    add(r.store, Number.isSafeInteger(c) && c > 0 ? c : 1);
  });
  state.entries.forEach(function (e) { add(e.store, 1); });
  return Object.keys(byKey).map(function (k) { return byKey[k]; })
    .sort(function (a, b) {
      return b.count !== a.count ? b.count - a.count : a.name.localeCompare(b.name, "ja");
    })
    .slice(0, 20)
    .map(function (x) { return x.name; });
}
function renderStoreDatalist() {
  var el = document.getElementById("storeDatalist");
  if (!el) return;
  el.innerHTML = '<datalist id="storeList">'
    + storeCandidates().map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join("")
    + '</datalist>';
}

// ---------- 請求先の入力候補(2026-07-21改修11-3) ----------
// 候補 = 取引先リスト(clientList)+ 過去の請求先(entries の bills[].to)。
// 表記ゆれ(空白・大小文字)は normalize で同一視して重複除去し、使用回数の多い順に最大20件。
// 店名用の storeList とは別に clientList という datalist を1個だけ生成し、請求先の新規入力欄で共有する
function clientCandidates() {
  var byKey = {};
  function add(name, cnt) {
    var n = String(name || "").trim();
    var key = normalize(n);
    if (!key) return;
    if (!byKey[key]) byKey[key] = { name: n, count: 0 };
    byKey[key].count += cnt;
  }
  state.clientList.forEach(function (c) { add(c, 1); });
  state.entries.forEach(function (e) {
    (Array.isArray(e.bills) ? e.bills : []).forEach(function (b) { add(b.to, 1); });
  });
  return Object.keys(byKey).map(function (k) { return byKey[k]; })
    .sort(function (a, b) {
      return b.count !== a.count ? b.count - a.count : a.name.localeCompare(b.name, "ja");
    })
    .slice(0, 20)
    .map(function (x) { return x.name; });
}
function renderClientDatalist() {
  var el = document.getElementById("clientDatalist");
  if (!el) return;
  el.innerHTML = '<datalist id="clientList">'
    + clientCandidates().map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join("")
    + '</datalist>';
}

// ---------- 取引先チップの長押し2秒(2026-07-21改修11-1) ----------
// 通常タップ = その取引先1件だけを選択(単一選択)/ 2秒の長押し = 複数選択として追加・解除。
// 長押し中はチップの左から色が満ちる進行表示を出し、指を離す・動かす・2秒未満なら通常タップに戻す。
// タッチ(touchstart/touchend/touchcancel/touchmove)とマウス(mousedown/mouseup/mouseleave)の両対応。
// 長押しが成立したら、直後に発生するclickを時間ガードで抑止する(1回の操作で2回動くのを防ぐ)
var lpTimer = null;      // 長押し判定のタイマー
var lpEl = null;         // 長押し中のチップ
// 長押しが成立したことを表すフラグ(2026-07-21改修11-8・検証8 問題3の修正)。
// 「◯ミリ秒以内のclickを無視する」という時間切れ式にすると、2秒より長く押し続けて離したときに
// 抑止が切れて選択が戻ってしまう。押している時間に関係なく「次の1回のclickだけ」を確実に捨てる
var lpFired = false;
var lastTouchAt = 0;     // 直近のタッチ操作時刻(タッチ端末の擬似マウスイベント除け)
var LONG_PRESS_MS = 2000;
function lpTargetOf(ev) {
  var t = ev.target;
  var el = (t && t.closest) ? t.closest('[data-act="client-tab"]') : null;
  if (!el || el.disabled) return null;
  if (el.dataset.name === "all") return null; // 「すべて」チップは長押し対象外(従来どおりの解除ボタン)
  return el;
}
function lpCancel() {
  if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
  if (lpEl) { lpEl.classList.remove("lp"); lpEl = null; }
}
function lpStart(ev) {
  var el = lpTargetOf(ev);
  lpCancel();
  lpFired = false; // 新しい押下が始まったので、前回の抑止フラグは必ず解除する(取りこぼし防止)
  if (!el) return;
  lpEl = el;
  el.classList.add("lp");
  lpTimer = setTimeout(function () {
    lpTimer = null;
    var name = lpEl ? lpEl.dataset.name : "";
    if (lpEl) { lpEl.classList.remove("lp"); lpEl = null; }
    if (!name) return;
    // 複数選択モード: その取引先を追加・解除する
    var i = ui.viewClients.indexOf(name);
    if (i >= 0) ui.viewClients.splice(i, 1);
    else ui.viewClients.push(name);
    lpFired = true; // 次に来るclickを1回だけ捨てる(押している時間の長さに関係なく効く)
    try { if (typeof navigator.vibrate === "function") navigator.vibrate(30); } catch (e) { /* 非対応環境では何もしない */ }
    render();
  }, LONG_PRESS_MS);
}
document.addEventListener("touchstart", function (ev) {
  lastTouchAt = Date.now();
  lpStart(ev);
}, { passive: true });
document.addEventListener("touchend", function () { lastTouchAt = Date.now(); lpCancel(); }, { passive: true });
document.addEventListener("touchcancel", lpCancel, { passive: true });
document.addEventListener("touchmove", function () { lastTouchAt = Date.now(); lpCancel(); }, { passive: true });
document.addEventListener("mousedown", function (ev) {
  if (Date.now() - lastTouchAt < 1000) return; // タッチ端末が出す擬似マウスイベントは無視する
  lpStart(ev);
});
document.addEventListener("mouseup", lpCancel);
// 押している最中にチップの外へカーソルが出たらキャンセルする(mouseleaveは伝播しないのでキャプチャで拾い、
// 対象が長押し中のチップのときだけ止める。無関係な要素のmouseleaveでは止めない)
document.addEventListener("mouseleave", function (ev) {
  if (lpEl && ev.target === lpEl) lpCancel();
}, true);

document.addEventListener("click", function (ev) {
  var t = ev.target;
  var el = (t && t.closest) ? t.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  // 長押しが成立した直後のclickは1回だけ無視する(二重発火防止)
  if (el.dataset.act === "client-tab" && lpFired) {
    lpFired = false;
    return;
  }
  var fn = ACTIONS[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (!el || !el.dataset || !el.dataset.input) return;
  var kind = el.dataset.input;
  if (kind === "pending") updPending(el.dataset.id, el.dataset.field, el.value);
  else if (kind === "draft") updDraft(el.dataset.field, el.value);
  else if (kind === "import-text") ui.importText = el.value;
  else if (kind === "bill-amt") {
    // 請求先ごとの金額入力(2026-07-21改修A): bills[bidx].amount を更新し、自分負担の表示だけ差し替える
    var bt = billTargetOf(el.dataset.scope, el.dataset.id || "");
    var bx = bt && Array.isArray(bt.bills) ? bt.bills[Number(el.dataset.bidx)] : null;
    if (bx) {
      bx.amount = el.value;
      markDirty();
      var ownBox = document.getElementById(billOwnId(el.dataset.scope, el.dataset.id || ""));
      if (ownBox) ownBox.innerHTML = billOwnHtml(bt);
    }
  }
  // 人数・金額の入力中は「1人あたり・5,000円判定」「自分負担」の表示部分だけをその場で更新する
  // (画面全体を描き直すと入力欄のフォーカスが外れるため、該当ブロックのみ差し替える)
  if ((kind === "pending" || kind === "draft") && (el.dataset.field === "persons" || el.dataset.field === "amount")) {
    var obj = kind === "draft" ? state.editDraft : findPendingById(el.dataset.id);
    var box = document.getElementById(personsCalcId(kind, el.dataset.id || ""));
    if (obj && box) box.innerHTML = personsCalcHtml(kind, el.dataset.id || "", obj, "");
    var ob2 = document.getElementById(billOwnId(kind, el.dataset.id || ""));
    if (obj && ob2 && el.dataset.field === "amount") ob2.innerHTML = billOwnHtml(obj);
  }
});
document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (!el || !el.dataset) return;
  // 人数の直接入力の確定(フォーカスが外れたとき): 会食科目の自動セット(2026-07-21改修B)を反映して描き直す
  if (el.dataset.input && (el.dataset.input === "pending" || el.dataset.input === "draft") && el.dataset.field === "persons") {
    var t = billTargetOf(el.dataset.input, el.dataset.id || "");
    if (t) {
      autoSetCat(t);
      markDirty();
      render();
    }
    return;
  }
  if (!el.dataset.change) return;
  var kind = el.dataset.change;
  if (kind === "pending") {
    // 科目プルダウン=手動選択(2026-07-21改修B: 以降自動セットしない・学習は従来どおり)
    if (el.dataset.field === "category") setCategoryManual("pending", el.dataset.id, el.value);
    else updPendingR(el.dataset.id, el.dataset.field, el.value);
  }
  else if (kind === "pending-client") pendingClientSel(el.dataset.id, el.value);
  else if (kind === "draft") {
    if (el.dataset.field === "category") setCategoryManual("draft", "", el.value);
    else updDraftR(el.dataset.field, el.value);
  }
  else if (kind === "draft-client") draftClientSel(el.value);
  else if (kind === "entry-cat") changeEntryCategory(el.dataset.id, el.value);
});
document.addEventListener("focusin", function (ev) {
  var el = ev.target;
  if (el && el.dataset && el.dataset.focus === "select" && el.select) el.select();
});

// ---------- 起動 ----------
// 補強(2026-07-20・壁打ち補強案7): 容量整理でこのサイトのデータを消さないようブラウザにお願いする。
// navigator.storage.persist = 「保存データを保護対象にして」と頼むAPI(Chrome系で有効・Safariでは効果薄)。
// 断られても・非対応でも動作に影響はない(あくまで保険)
try {
  if (navigator.storage && typeof navigator.storage.persist === "function") {
    navigator.storage.persist().catch(function () { /* 断られても何もしない */ });
  }
} catch (e) { /* 非対応環境では何もしない */ }
loadState();
render();
renderPage();
</script>
