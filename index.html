<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>経理台帳</title>
<style>
  /* ===============================================
     案5 ユニバーサルデザイン(2026-07-21 全面変更)
     正: 経理\docs\提案\デザイン案\案5-ユニバーサル.html のトークン。
     色弱対応配色(青と橙が軸。赤と緑を並べない)。
     すべての区別を「色+形(アイコン)+文字」の三重で符号化。
     UD書体優先・基本17px・行間1.75・コントラスト7:1以上。
     =============================================== */
  :root {
    color-scheme: light;
    --bg: #FBFBF9;
    --card: #FFFFFF;
    --ink: #20242B;          /* 本文 15:1 */
    --sub: #50565F;          /* 補助 7.3:1 */
    --line: #C9CDD4;
    --blue: #0058A3;         /* 会議費・主ボタン(白文字と7.6:1) */
    --blue-bg: #E5F0FA;
    --orange: #8A4B00;       /* 接待交際費(7.1:1) */
    --orange-bg: #FCEBD4;
    --purple: #5B3E96;       /* その他科目・請求(立替)関連 */
    --purple-bg: #EEE9F8;
    --warn: #9A3412;         /* 未承認・警告・破壊的操作(白文字と7:1) */
    --warn-bg: #FFF4E5;
    --font-ud: "BIZ UDGothic", "UD デジタル 教科書体 N-R", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--font-ud);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 448px; margin: 0 auto; padding: 20px 14px 120px; }
  button { font-family: var(--font-ud); cursor: pointer; }

  /* ヘッダー */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .header h1 { font-size: 25px; font-weight: 800; }
  .header-btns { display: flex; gap: 6px; }
  .chip-btn {
    font-size: 15px; font-weight: 700; color: var(--ink); background: var(--card);
    border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 10px;
    min-height: 46px;
  }

  /* 保存バー(2026-07-21 ユーザー指示: 手動保存ボタン+保存状態の常時表示) */
  .save-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .save-btn {
    flex-shrink: 0; font-size: 16px; font-weight: 800; color: #FFF; background: var(--ink);
    border: none; border-radius: 10px; padding: 8px 20px; min-height: 46px;
    transition: transform .06s ease;
  }
  .save-btn:active { transform: translateY(2px) scale(0.96); }
  .save-status { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 14px; line-height: 1.5; min-width: 0; }
  .save-done { font-weight: 800; color: var(--blue); }
  .save-dirty { font-weight: 800; color: var(--warn); }

  /* 警告アイコン(丸地に白の「!」。色が見えなくても形と文字で分かる) */
  .warn-ic {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--warn); color: #FFF; font-size: 20px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
  }
  .warn-ic.sm { width: 24px; height: 24px; font-size: 15px; }

  /* サマリー */
  .summary {
    background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px;
    padding: 12px 18px; margin-bottom: 14px;
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0 8px;
  }
  .summary .label { font-size: 15px; font-weight: 800; }
  .summary .amount { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* お知らせ(警告=warn系・案内=blue系。色+枠+アイコン+文字の三重) */
  .notice { font-size: 15px; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.7; background: var(--card); border: 1.5px solid var(--line); }
  .notice-warn { color: var(--ink); background: var(--warn-bg); border: 1.5px solid var(--warn); }
  .notice-error { color: var(--ink); background: var(--warn-bg); border: 2px solid var(--warn); font-weight: 700; }
  .notice-info { color: var(--ink); background: var(--blue-bg); border: 1.5px solid var(--blue); white-space: pre-line; }
  .notice .n-head { display: flex; align-items: flex-start; gap: 8px; }
  .notice .n-head .warn-ic { margin-top: 3px; }
  .notice button.inline-act {
    display: block; width: 100%; margin-top: 8px; padding: 12px; min-height: 52px;
    background: var(--warn); color: #FFF; border: none; border-radius: 10px; font-size: 15px; font-weight: 800;
  }

  /* 入力ボタン群 */
  .btn { display: block; width: 100%; border-radius: 12px; font-weight: 800; letter-spacing: 0.04em; margin-bottom: 10px; }
  .btn:active { opacity: 0.85; }
  .btn-primary { background: var(--blue); color: #FFF; border: none; font-size: 18px; padding: 15px; min-height: 56px; }
  .btn-outline-ai { background: var(--card); color: var(--blue); border: 2px solid var(--blue); font-size: 16px; padding: 13px; min-height: 52px; }
  /* 手入力の2つの入り口(2026-07-21改修13-10)。横に並べ、色+枠+文字で役割を区別する。
     回収は請求・立替系なので紫(--purple)。中身に押し広げられないよう min-width:0 */
  .entry-btns { display: flex; gap: 8px; }
  .entry-btns > .btn { min-width: 0; }
  .btn-collect { background: var(--card); color: var(--purple); border: 2px solid var(--purple); font-size: 16px; padding: 13px 6px; min-height: 56px; }

  /* パネル共通 */
  .panel { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .panel .hint { font-size: 14px; color: var(--sub); font-weight: 700; line-height: 1.7; margin-bottom: 8px; }
  textarea {
    width: 100%; font-family: ui-monospace, monospace; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 10px;
    background: var(--card); color: var(--ink);
  }
  .panel .act {
    width: 100%; padding: 13px; margin-top: 8px; min-height: 52px;
    background: var(--blue); color: #FFF; border: none; border-radius: 10px; font-size: 16px; font-weight: 800;
  }

  /* フォーム部品(ラベルは太字ink・入力欄は1.5px枠) */
  .field { display: block; margin-bottom: 8px; }
  .field > span { font-size: 13px; color: var(--ink); font-weight: 700; display: block; }
  input[type="text"], input[type="date"], select {
    font-family: var(--font-ud);
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 9px 10px; font-size: 17px; width: 100%; min-height: 44px;
  }
  .num { font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  /* 2列(日付・金額)が中身に押し広げられないようにする(±ボタン追加に伴う調整・2026-07-21改修12-2) */
  .grid2 > * { min-width: 0; }
  /* 金額欄の±ボタン(2026-07-21改修12-2): スマホのテンキーに「−」が無いので、タップで符号を反転する */
  .field > .amt-wrap, .amt-wrap { display: flex; gap: 6px; align-items: stretch; }
  .amt-wrap input { flex: 1 1 auto; min-width: 0; width: auto; }
  .sign-btn {
    flex: 0 0 auto; width: 48px; min-height: 44px; border: 2px solid var(--ink); background: var(--card);
    color: var(--ink); border-radius: 8px; font-size: 19px; font-weight: 800; line-height: 1;
  }
  .sign-btn.on { background: var(--warn); border-color: var(--warn); color: #FFF; }
  .sign-note { font-size: 12px; font-weight: 800; color: var(--warn); }
  select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* 承認待ち(未承認): warn-bg地+太い破線枠+!アイコン+文字。点滅表現は使わない */
  .pending-card { position: relative; background: var(--warn-bg); border: 4px dashed var(--warn); border-radius: 14px; padding: 14px 14px 16px; margin-bottom: 16px; }
  .pending-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .pending-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: var(--warn); }
  .pending-source { font-size: 13px; color: var(--sub); font-weight: 700; }
  .pending-source.rule { color: var(--blue); }
  .fold-btn { font-size: 14px; font-weight: 700; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; }
  .pending-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .discard-btn { font-size: 15px; font-weight: 700; color: var(--sub); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; min-height: 52px; }
  .stamp-btn {
    width: 80px; height: 80px; border-radius: 50%;
    border: 3px solid var(--warn); color: var(--warn); background: var(--card);
    font-weight: 800; font-size: 19px; letter-spacing: 0.1em; line-height: 1.3;
    transition: transform .1s;
  }
  /* 押した感の強化(2026-07-21改修E): 押下でしっかり縮小 → 大きめの朱印スタンプ演出(コントラストは--warn系で7:1維持) */
  .stamp-btn:active { transform: scale(0.86); }
  .stamp-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.6); border-radius: 14px;
  }
  .stamp-mark {
    width: 112px; height: 112px; border-radius: 50%;
    border: 5px solid var(--warn); color: var(--warn); background: var(--card);
    box-shadow: 0 0 0 8px var(--warn-bg);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 46px;
    animation: stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .pending-collapsed {
    width: 100%; margin-bottom: 12px; padding: 10px 12px; min-height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--warn-bg); border: 4px dashed var(--warn); border-radius: 12px; color: var(--ink);
  }
  .pending-collapsed .left { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; font-weight: 700; }
  .pending-collapsed .tag { color: var(--warn); font-weight: 800; white-space: nowrap; }
  .pending-collapsed .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pending-collapsed .open-label { font-size: 14px; font-weight: 700; color: var(--blue); white-space: nowrap; }

  /* マイナス記帳(返金・値引き)の確認(警告様式: 破線枠+アイコン+文字) */
  .neg-confirm { border: 4px dashed var(--warn); background: var(--card); border-radius: 12px; padding: 12px; font-size: 15px; line-height: 1.7; margin-bottom: 12px; color: var(--ink); }
  .neg-confirm .row { display: flex; gap: 8px; margin-top: 8px; }
  /* 消える請求(立替)の警告行(2026-07-21改修13-1)。アイコン+文字+色の三重符号化 */
  .neg-confirm .bill-lost { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; padding: 8px 10px; background: var(--warn-bg); border: 1.5px solid var(--warn); border-radius: 10px; font-weight: 800; }
  .neg-confirm .go { flex-grow: 1; padding: 13px; min-height: 52px; background: var(--warn); color: #FFF; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; }
  .neg-confirm .stop { padding: 13px 16px; min-height: 52px; background: var(--card); color: var(--sub); border: 1.5px solid var(--line); border-radius: 10px; font-size: 15px; font-weight: 700; }

  /* まとめて承認(warn塗り52px級。確認は未承認と同じ破線枠+!+文字) */
  .bulk-bar { margin-bottom: 12px; }
  .bulk-btn { background: var(--warn); color: #FFF; border: none; font-size: 16px; padding: 13px; min-height: 52px; }
  .bulk-confirm { background: var(--warn-bg); border: 4px dashed var(--warn); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .bulk-confirm .msg { font-size: 16px; margin-bottom: 4px; display: flex; align-items: flex-start; gap: 8px; }
  .bulk-confirm .msg .warn-ic { margin-top: 3px; }
  .bulk-confirm .sub { font-size: 14px; color: var(--sub); font-weight: 700; margin-bottom: 8px; }
  .bulk-confirm .row { display: flex; gap: 8px; }
  .bulk-confirm .go { flex-grow: 1; padding: 13px; min-height: 52px; background: var(--warn); color: #FFF; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; }
  .bulk-confirm .stop { padding: 13px 16px; min-height: 52px; background: var(--card); color: var(--sub); border: 1.5px solid var(--line); border-radius: 10px; font-size: 15px; font-weight: 700; }

  /* タブ */
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab {
    font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 999px; white-space: nowrap; min-height: 44px;
    background: var(--card); color: var(--ink); border: 1.5px solid var(--line); flex-shrink: 0;
  }
  .tab.on { background: var(--blue); color: #FFF; border-color: var(--blue); font-weight: 800; }
  /* 取引先チップの長押し2秒(2026-07-21改修11-1: 通常タップ=単一選択 / 2秒長押し=複数選択)。
     長押し中は左から色が満ちていく進行表示を出す(色だけでなく枠も太くする) */
  .tab.lp-target { position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .tab.lp { border-width: 3px; border-color: var(--purple); }
  .tab.lp::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: var(--purple); opacity: 0.30; pointer-events: none;
    animation: lpFill 2s linear forwards;
  }
  @keyframes lpFill { from { width: 0; } to { width: 100%; } }
  .multi-note { font-size: 14px; font-weight: 800; color: var(--purple); margin: 2px 0 8px; }

  /* 回収済みの達成演出(2026-07-21改修11-6): 承認印と同じ様式の「済」スタンプ */
  .paid-stamp-layer { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; pointer-events: none; }

  /* 請求先ごとの安定色バッジ(2026-07-21改修11-6): 名前のハッシュで色を固定。
     色だけに頼らず、頭文字+フルネームの文字を必ず併記する(三重符号化) */
  .client-badge {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 26px; height: 26px; border-radius: 8px; margin-right: 6px;
    color: #FFF; font-size: 14px; font-weight: 800; vertical-align: -5px;
  }

  /* 科目の三重符号化(色+形+文字): 会議費=青● / 接待交際費=橙■ / その他13科目=紫◆ */
  .cat-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 800; border-radius: 8px; padding: 3px 10px;
    border-width: 2px; border-style: solid;
  }
  .cat-kaigi { color: var(--blue); background: var(--blue-bg); border-color: var(--blue); }
  .cat-settai { color: var(--orange); background: var(--orange-bg); border-color: var(--orange); }
  .cat-sonota { color: var(--purple); background: var(--purple-bg); border-color: var(--purple); }
  .shape { font-size: 13px; line-height: 1; }
  select.cat-kaigi, select.cat-settai { font-weight: 800; }
  select.cat-kaigi { color: var(--blue); background: var(--blue-bg); border-color: var(--blue); }
  select.cat-settai { color: var(--orange); background: var(--orange-bg); border-color: var(--orange); }

  /* ワンタップ仕分けチップ(形+科目名+色の三重符号化。横1行スクロール) */
  .cat-chips { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 8px; padding-bottom: 2px; }
  .cat-chip { flex-shrink: 0; min-height: 48px; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 5px 10px; color: var(--ink); }
  .cat-chip .t { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; line-height: 1.5; }
  .cat-chip .t .shape { margin-right: 4px; }
  .cat-chip .s { display: block; font-size: 12px; color: var(--sub); font-weight: 700; white-space: nowrap; line-height: 1.4; }
  .cat-chip.on { border: 2px solid var(--purple); background: var(--purple-bg); }
  .cat-chip.on .t { color: var(--purple); }
  .cat-chip.on-kaigi { border: 2px solid var(--blue); background: var(--blue-bg); }
  .cat-chip.on-kaigi .t { color: var(--blue); }
  .cat-chip.on-settai { border: 2px solid var(--orange); background: var(--orange-bg); }
  .cat-chip.on-settai .t { color: var(--orange); }

  /* 人数選択(会議費/接待交際費のときだけ表示)と割り勘表示 */
  .persons-box { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .persons-box .p-label { font-size: 13px; color: var(--ink); font-weight: 700; margin-bottom: 4px; }
  .p-chips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; margin-bottom: 6px; }
  .p-chip { flex-shrink: 0; min-width: 44px; min-height: 44px; font-size: 16px; font-weight: 800; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; color: var(--ink); padding: 4px 8px; }
  .p-chip.on { border: 2px solid var(--blue); background: var(--blue-bg); color: var(--blue); }
  .p-calc { font-size: 15px; font-weight: 800; }
  .p-judge { display: inline-block; font-size: 14px; font-weight: 800; border-radius: 8px; border-width: 2px; border-style: solid; padding: 2px 10px; margin: 2px 0 6px; }
  .p-judge.j-kaigi { color: var(--blue); background: var(--blue-bg); border-color: var(--blue); }
  .p-judge.j-settai { color: var(--orange); background: var(--orange-bg); border-color: var(--orange); }
  .p-note { font-size: 13px; color: var(--sub); font-weight: 700; }
  .p-label { font-size: 13px; color: var(--ink); font-weight: 700; margin-bottom: 4px; }

  /* 科目別集計 */
  .breakdown { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 16px; margin: 8px 0 16px; }
  .breakdown h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .breakdown .row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .breakdown .row:last-of-type { border-bottom: none; }
  .breakdown .row .val { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 17px; }
  .breakdown .total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 800; border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 8px; }
  .breakdown .total .val { font-variant-numeric: tabular-nums; }

  /* 台帳(行頭に48px科目スタンプ: 形+略字) */
  .month-sec { margin-bottom: 24px; }
  .month-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 8px; }
  .month-head h2 { font-size: 16px; font-weight: 800; }
  .month-head .total { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ledger-card { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 2px 12px; }
  .entry { border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: none; }
  .entry-row {
    width: 100%; text-align: left; padding: 12px 0;
    display: flex; align-items: center; gap: 12px;
    background: none; border: none; color: var(--ink);
  }
  .stamp {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; border-width: 2px; border-style: solid; line-height: 1.2;
  }
  .stamp .sh { font-size: 12px; }
  .stamp .ab { font-size: 12px; }
  .stamp.kaigi { color: var(--blue); background: var(--blue-bg); border-color: var(--blue); }
  .stamp.settai { color: var(--orange); background: var(--orange-bg); border-color: var(--orange); }
  .stamp.sonota { color: var(--purple); background: var(--purple-bg); border-color: var(--purple); }
  .entry-main { flex-grow: 1; min-width: 0; }
  .entry-store { display: block; font-size: 17px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-sub { display: block; font-size: 14px; color: var(--sub); font-weight: 700; line-height: 1.5; }
  .entry-amount { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amount-minus { color: var(--warn); }

  billsCollectConfirm: null, // 月まとめ回収の確認中 {type:"collect"|"cancel", month}

// ---------- ユーティリティ ----------
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function normalize(s) { return String(s || "").toLowerCase().replace(/[\s　]/g, ""); }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
// 保存日時の記録用 "YYYY-MM-DD HH:MM" と表示用 "M/D HH:MM"(2026-07-21 保存状態表示)
function nowStamp() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")
    + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function stampDisp(s) {
  var m = /^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(String(s || ""));
  return m ? Number(m[1]) + "/" + Number(m[2]) + " " + m[3] : String(s || "");
}
function yen(n) { return "¥" + Number(n || 0).toLocaleString("ja-JP"); }
// 表示用: マイナスは会計慣行の「△」表記(例: -500 → △500)
function yenDisp(n) {
  n = Number(n || 0);
  return n < 0 ? "△" + Math.abs(n).toLocaleString("ja-JP") : "¥" + n.toLocaleString("ja-JP");
}
function monthLabel(ym) {
  var p = ym.split("-");
  return p[0] + "年" + Number(p[1]) + "月";
}
function newId() { return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); }

// 金額文字列 → 整数円。整数にならなければ NaN
// NFKC正規化で全角数字「５４０」・全角マイナス「−」も半角に直してから解釈する
// マイナスは返金・値引きとして許可(承認時に確認あり)
// 桁が大きすぎる値(安全に扱える整数の範囲外)も NaN にする(2026-07-21改修13-8)。
// 読み込み側(sanitizeEntry)は Number.isSafeInteger で弾くため、ここを素通しにすると
// 「記帳できたのに再読み込みで黙って消える」記帳ができてしまう
function parseAmount(v) {
  var s = String(v == null ? "" : v).normalize("NFKC").trim().replace(/[¥￥,\s円]/g, "");
  if (s === "") return NaN;
  if (!/^-?\d+$/.test(s)) return NaN;
  var n = Number(s);
  if (!Number.isSafeInteger(n)) return NaN;
  return n;
}
// 「数字だけれど桁が大きすぎる」入力かどうか(2026-07-21改修13-8)。
// 文字混じり(NaN)と区別して、専用の案内を出すために使う
function amountTooBig(v) {
  var s = String(v == null ? "" : v).normalize("NFKC").trim().replace(/[¥￥,\s円]/g, "");
  return /^-?\d+$/.test(s) && !Number.isSafeInteger(Number(s));
}

// 人数(2026-07-21追加): 整数1以上のみ許可(上限999)。
// 0・マイナス・小数・文字・空欄などの不正値は 1 に補正する(旧データ補完と同じ方式)
function parsePersons(v) {
  var n = parseAmount(v);
  if (isNaN(n) || n < 1) return 1;
  if (n > 999) return 999;
  return n;
}
// 幽霊フラグ(2026-07-21改修11-5): 取り込み11列目の値を真偽に直す。
// 「1」「true」「○」「◯」「はい」だけをON扱いにし、それ以外(空欄・0・false・任意の文字)はOFF。
// 旧CSVの11列目(回収状態「回収済み」「未回収」)が誤ってONにならないよう、完全一致のみ許可する
function parseGhostFlag(v) {
  var s = String(v == null ? "" : v).trim();
  try { s = s.normalize("NFKC"); } catch (e) { /* 非対応環境ではそのまま */ }
  s = s.toLowerCase();
  return s === "1" || s === "true" || s === "○" || s === "◯" || s === "はい";
}

// 請求先ごとの安定色(2026-07-21改修11-6): 名前のハッシュから下のパレットを巡回して割り当てる。
// 同じ名前なら常に同じ色(データを消しても復元しても変わらない)。
// パレットは案5のコントラスト基準(白文字と7:1以上)を満たす濃色のみ。
// 色だけに頼らず、頭文字+フルネームの文字を必ず併記する(三重符号化の原則)
var CLIENT_COLORS = ["#0058A3", "#8A4B00", "#5B3E96", "#9A3412", "#005E56", "#8A2B6B"];
function clientColor(name) {
  var s = String(name || "");
  if (!s || s === "(請求先なし)") return "#50565F"; // 請求先なしは補助色(--sub)固定
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) % 1000000007;
  }
  return CLIENT_COLORS[h % CLIENT_COLORS.length];
}
// 色バッジ+名前(名前の文字は必ず表示する)
function clientBadgeHtml(name) {
  var s = String(name || "");
  var head = (!s || s === "(請求先なし)") ? "—" : s.slice(0, 1);
  return '<span class="client-badge" style="background:' + clientColor(s) + ';" aria-hidden="true">' + esc(head) + '</span>';
}

// メモへの「○名」自動追記(人数2以上のとき)。
// 既に「数字+名」の表記(全角数字含む)があれば追記しない(手書きの記載を優先・重複防止)
function appendPersonsMemo(memo, persons) {
  var m = String(memo || "");
  if (/[0-90-9]+\s*名/.test(m)) return m;
  return m ? m + "・" + persons + "名" : persons + "名";
}

// ---------- 複数請求(bills 配列・2026-07-21改修A) ----------
// 記帳1件の請求は bills = [{to(請求先名), amount(整数円・1以上), status("unpaid"=未回収/"paid"=回収済み), paidDate}] の配列。
// 自分負担 = 総額 − billSum(bills)。整数の足し引きのみ(割り算・浮動小数点なし)
function billSum(bills) {
  var s = 0;
  (Array.isArray(bills) ? bills : []).forEach(function (b) {
    var n = Number(b && b.amount);
    if (Number.isSafeInteger(n) && n > 0) s += n;
  });
  return s;
}
// 請求先名に半角「/」は使えない(CSV往復の「/」区切りが壊れるため)。全角「/」へ置換する
function cleanBillName(s) {
  return String(s == null ? "" : s).trim().replace(/\//g, "／");
}
// 入力中の bills(金額は編集用の文字列)を検証して整数化する。戻り値 {bills, error}。
// 空欄・0円の行は「請求しない」として除外。整数でない・負の値、Σ請求分>総額 はエラーで止める(黙って丸めない)
// マイナスにすると消えてしまう請求(立替)の合計と件数(2026-07-21改修13-1)。
// 「±」1回で請求が黙って消えないよう、承認・保存の前にこの金額を確認パネルで見せる
function billsRiskSum(obj) {
  var sum = 0, cnt = 0, names = [];
  (Array.isArray(obj && obj.bills) ? obj.bills : []).forEach(function (b) {
    var n = parseAmount(b && b.amount);
    if (isNaN(n) || n <= 0) return;
    sum += n;
    cnt++;
    var nm = cleanBillName(b.to);
    if (nm && names.indexOf(nm) === -1) names.push(nm);
  });
  return { sum: sum, count: cnt, names: names };
}
function parseBillsInput(obj, amt) {
  // マイナス記帳(返金・値引き・立替の回収)は請求なし固定。
  // 請求が入っていた場合に黙って捨てないよう、呼び出し側(approveOne / saveEdit)で
  // billsRiskSum() を使った確認パネルを必ず挟む(2026-07-21改修13-1)
  if (amt < 0) return { bills: [], error: "" };
  var out = [], sum = 0;
  var src = Array.isArray(obj.bills) ? obj.bills : [];
  for (var i = 0; i < src.length; i++) {
    var b = src[i];
    var raw = String(b.amount == null ? "" : b.amount).trim();
    if (raw === "") continue;
    var n = parseAmount(raw);
    if (isNaN(n)) return { bills: [], error: "請求分は整数(小数点なしの円)で入力してください。例: 4333" };
    if (n < 0) return { bills: [], error: "請求分にマイナスは入れられません(返品・値引きは金額欄のマイナス記帳を使ってください)。" };
    if (n === 0) continue;
    var st = b.status === "paid" ? "paid" : "unpaid";
    out.push({
      to: cleanBillName(b.to),
      amount: n,
      status: st,
      paidDate: st === "paid"
        ? (/^\d{4}-\d{2}-\d{2}$/.test(String(b.paidDate || "")) ? String(b.paidDate) : todayStr())
        : "",
      // 自動反映の印は編集の往復で失わないよう引き継ぐ(2026-07-21改修11-7)。
      // 落とすと「自動で回収済み」が「手動で回収済み」に化け、回収額が別の請求へ二重に割り当てられてしまう
      paidBy: typeof b.paidBy === "string" ? b.paidBy : "",
      autoSkip: b.autoSkip === true,
      paidAmt: (function (v) {
        var x = Number(v);
        if (!Number.isSafeInteger(x) || x < 0) return 0;
        return x > n ? n : x;
      })(b.paidAmt),
      // 手動で「回収済みにする」を押したぶん(2026-07-21改修13-3)。編集の往復で失わないよう引き継ぐ
      paidManual: (function (v) {
        var x = Number(v);
        if (!Number.isSafeInteger(x) || x < 0) return 0;
        return x > n ? n : x;
      })(b.paidManual)
    });
    sum += n;
  }
  if (sum > amt) {
    return { bills: [], error: "請求分の合計(" + yen(sum) + ")が総額(" + yen(amt) + ")を超えています。請求先ごとの金額を直してから承認してください。" };
  }
  return { bills: out, error: "" };
}
// 承認待ちカード・編集ドラフトの移行(2026-07-21改修A)。
// 旧形式(billAmount/billTo)の下書きは bills 配列(金額は編集用の文字列)へ自動変換する
function migratePendingBills(p) {
  if (!Array.isArray(p.bills)) {
    var b = parseAmount(p.billAmount);
    p.bills = (!isNaN(b) && b > 0) ? [{ to: cleanBillName(p.billTo), amount: String(b), status: "unpaid", paidDate: "" }] : [];
  } else {
    p.bills = p.bills.filter(function (x) { return x && typeof x === "object"; })
      .map(function (x) {
        return {
          to: cleanBillName(x.to),
          amount: String(x.amount == null ? "" : x.amount),
          status: x.status === "paid" ? "paid" : "unpaid",
          paidDate: typeof x.paidDate === "string" ? x.paidDate : "",
          paidBy: typeof x.paidBy === "string" ? x.paidBy : "",
          autoSkip: x.autoSkip === true,
          paidAmt: Number(x.paidAmt) || 0,
          paidManual: Number(x.paidManual) || 0
        };
      });
  }
  delete p.billAmount;
  delete p.billTo;
  if (typeof p.billToNew !== "string") p.billToNew = "";
  p.billToAdding = p.billToAdding === true;
  p.ghost = p.ghost === true;             // 幽霊(CSV除外)の下書き値(2026-07-21改修11-4/11-5)
  // 立替の回収として記録中(2026-07-21改修13-11で collectMode から collect に一本化。
  // 前の版で保存された承認待ちカードの collectMode も引き継ぐ)
  p.collect = p.collect === true || p.collectMode === true;
  delete p.collectMode;
  p.catAuto = p.catAuto === true;   // 自動セットされた会食科目(学習除外の印)
  p.catManual = p.catManual === true; // 手動で科目を選んだ(以降は自動セットしない)
  return p;
}
// 旧形式ドラフトの回収状態を、変換済みの記帳(entries)から引き継ぐ
function syncDraftBillsFromEntry(wasOld) {
  if (!wasOld || !state.editDraft) return;
  for (var i = 0; i < state.entries.length; i++) {
    if (state.entries[i].id === String(state.editDraft.id)) {
      state.editDraft.bills = state.entries[i].bills.map(function (b) {
        return { to: b.to, amount: String(b.amount), status: b.status, paidDate: b.paidDate, paidBy: b.paidBy || "", autoSkip: b.autoSkip === true, paidAmt: Number(b.paidAmt) || 0, paidManual: Number(b.paidManual) || 0 };
      });
      break;
    }
  }
}

// ---------- 保存層 ----------
var saveTimer = null;
function markDirty() {
  if (!ui.loaded) return;
  // 回収行の自動反映(2026-07-21改修11-7): データが変わるたびにゼロから計算し直す(冪等なので二重反映しない)。
  // ここに置くことで、承認・編集・削除・幽霊解除・手動回収など、どの経路で変わっても取りこぼさない
  applyCollections();
  ui.dirty = true;        // 未保存の変更あり(2026-07-21 保存状態表示)
  ui.justSavedMsg = "";   // 「保存しました」表示は次の変更で消す
  renderSaveBar();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 500);
}
// manual=true は手動の「保存」ボタン経由(押した感のフィードバックを出す)
function persistNow(manual) {
  saveTimer = null;
  var prevStamp = state.lastSavedAt;
  try {
    var prev = localStorage.getItem(STORAGE_KEY);
    if (prev !== null) {
      localStorage.setItem(BACKUP_KEY, prev);
    }
    // 最終保存時刻は保存データにも含める(stringifyの前に更新。失敗時はcatchで戻す)
    state.lastSavedAt = nowStamp();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    ui.dirty = false;
    ui.savedThisSession = true;
    ui.noSavedData = false; // 保存できた=データが存在する状態になったので消失警告を下げる
    if (manual === true) {
      ui.justSavedMsg = "保存しました " + state.lastSavedAt.slice(11);
      // 押した感: 対応端末では短い振動(非対応でも何も起きない)
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e2) { /* 何もしない */ }
    }
    if (ui.saveError) { ui.saveError = ""; renderNotices(); }
    renderSaveBar();
    return true;
  } catch (e) {
    state.lastSavedAt = prevStamp; // 保存できていないので時刻を戻す
    ui.saveError = "自動保存に失敗しました。データは画面に残っています。ブラウザの空き容量が無い可能性があります。下のボタンで再保存を試すか、設定ページのJSON控えを取ってください。";
    renderNotices();
    renderSaveBar();
    return false;
  }
}
// 手動保存(2026-07-21 ユーザー指示): デバウンス待ちを止めて即時保存
function saveNow() {
  if (saveTimer) clearTimeout(saveTimer);
  persistNow(true);
}
function retrySave() {
  if (persistNow()) {
    ui.info = "再保存できました。";
    renderNotices();
  }
}
// 画面を離れる時、保存待ち(500msデバウンス中)があれば即時保存する
// beforeunload はモバイルで発火しないことが多いため visibilitychange + pagehide を使う
function flushSave() {
  if (saveTimer) persistNow();
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") flushSave();
});
window.addEventListener("pagehide", flushSave);
function loadState() {
  var raw = null, usedBackup = false;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  var d = null;
  if (raw !== null) {
    try { d = JSON.parse(raw); } catch (e) { d = null; }
  }
  if (d === null) {
    var braw = null;
    try { braw = localStorage.getItem(BACKUP_KEY); } catch (e) { braw = null; }
    if (braw !== null) {
      try { d = JSON.parse(braw); usedBackup = true; } catch (e) { d = null; }
    }
    // 保存データが空(本体も控えも無い)= 初回起動 or データ消失。ユーザーが即座に気づけるよう目立つ表示を出す(2026-07-21)
    if (raw === null && braw === null) {
      ui.noSavedData = true;
    }
  }
  if (d && typeof d === "object") {
    // 起動時の読み込みにもJSON復元と同じ検証をかける(localStorageが直接書き換えられていても
    // ¥NaN 表示やCSVへの不正値流出が起きないように)。不正な記帳行は読み飛ばして件数を案内する。
    // JSONごと壊れている場合の1世代前バックアップ(-backupキー)からの復旧は、従来どおり上のフォールバックで行う
    var badRows = 0;
    state.entries = (Array.isArray(d.entries) ? d.entries : []).map(sanitizeEntry).filter(function (x) {
      if (x === null) badRows++;
      return x !== null;
    });
    // 学習ルールにも importJson と同等の検査をかける(型チェックだけでなく、
    // key の再構築・科目の15種チェック・count の整数化まで行う)。
    // key の欠けたルールが findRule で例外を起こし、取り込みが無言で止まるのを防ぐ
    state.rules = Array.isArray(d.rules)
      ? d.rules.filter(function (r) { return r && typeof r === "object" && typeof r.store === "string" && typeof r.category === "string"; })
          .map(function (r) {
            return {
              key: normalize(r.store),
              store: r.store,
              category: CATEGORIES.indexOf(r.category) !== -1 ? r.category : "雑費",
              count: Number.isSafeInteger(Number(r.count)) ? Number(r.count) : 1
            };
          })
      : [];
    state.pendings = Array.isArray(d.pendings)
      ? d.pendings.filter(function (p) { return p && typeof p === "object"; }).map(migratePendingBills)
      : [];
    state.clientList = sanitizeClientList(d.clientList);
    state.editDraft = (d.editDraft && typeof d.editDraft === "object") ? d.editDraft : null;
    if (state.editDraft) {
      var draftWasOld = !Array.isArray(state.editDraft.bills);
      migratePendingBills(state.editDraft);
      syncDraftBillsFromEntry(draftWasOld);
    }
    state.lastBackup = typeof d.lastBackup === "string" ? d.lastBackup : "";
    // 最終保存時刻(2026-07-21追加)。旧データ(フィールドなし)は空文字で補完する
    state.lastSavedAt = typeof d.lastSavedAt === "string" ? d.lastSavedAt : "";
    // 削除ログ(2026-07-20追加)。旧データ(フィールドなし)は空配列で補完する
    state.deletedLog = sanitizeDeletedLog(d.deletedLog);
    // idを文字列にそろえる(旧データは数値idの可能性がある)
    state.entries.forEach(function (e) { e.id = String(e.id); });
    state.pendings.forEach(function (p) { p.id = String(p.id); });
    if (state.editDraft) {
      state.editDraft.id = String(state.editDraft.id);
      ui.expandedId = state.editDraft.id;
    }
    if (usedBackup && raw !== null) {
      ui.info = "保存データが壊れていたため、1つ前の控え(バックアップ)から復元しました。";
    }
    if (badRows > 0) {
      ui.info = (ui.info ? ui.info + "\n" : "")
        + "保存データに金額などが不正な記帳が " + badRows + " 件あったため読み飛ばしました。心当たりがなければ、設定ページのJSON控えから復元してください。";
    }
  }
  ui.loaded = true;

// ---------- 学習ルール ----------
function upsertRule(list, store, category) {
  var key = normalize(store);
  if (!key) return list;
  var next = list.slice();
  var i = -1;
  for (var k = 0; k < next.length; k++) { if (next[k].key === key) { i = k; break; } }
  if (i >= 0) {
    next[i] = { key: next[i].key, store: next[i].store, category: category, count: next[i].count + 1 };
  } else {
    next.push({ key: key, store: store, category: category, count: 1 });
  }
  return next;
}
function findRule(store) {
  var key = normalize(store);
  if (!key) return null;
  for (var i = 0; i < state.rules.length; i++) {
    if (state.rules[i].key === key) return state.rules[i];
  }
  for (var j = 0; j < state.rules.length; j++) {
    var rk = state.rules[j].key;
    if (key.indexOf(rk) !== -1 || rk.indexOf(key) !== -1) return state.rules[j];
  }
  return null;
}

// ---------- 仕分けチップ ----------
// 先頭固定2つ(会食系)+ 学習ルールの使用回数(count)を科目別に集計した上位3科目。
// 並びはアプリを開いてから最初の描画で1回だけ決めて固定する
// (承認のたびに入れ替わると、位置で覚えた指が誤タップするため)
var FIXED_CHIPS = [
  { cat: "会議費", sub: "打合せ飲食 〜5,000円/人・自分基準" },
  { cat: "接待交際費", sub: "会食 5,000円/人超" }

var chipListCache = null;
function getChipList() {
  if (chipListCache) return chipListCache;
  var countByCat = {};
  state.rules.forEach(function (r) {
    var n = Number(r && r.count);
    countByCat[r.category] = (countByCat[r.category] || 0) + (Number.isSafeInteger(n) && n > 0 ? n : 0);
  });
  var extras = CATEGORIES.filter(function (c) {
    return c !== "会議費" && c !== "接待交際費" && (countByCat[c] || 0) > 0;
  }).sort(function (a, b) {

  chipListCache = FIXED_CHIPS.concat(extras);

}

// 承認1件分の検証。戻り値 {entry, error}: OKなら entry に記帳用データ、NGなら entry=null(error に理由)
function validatePending(p) {
  var store = String(p.store || "").trim();
  // 桁が大きすぎる金額は記帳できない(2026-07-21改修13-8)。
  // 通していたら丸められて記帳され、再読み込みでその記帳が黙って消えていた
  if (amountTooBig(p.amount)) {
    return { entry: null, error: "金額の桁が大きすぎます。入力し直してください。" };
  }
  var amt = parseAmount(p.amount);
  var hasAmt = !isNaN(amt) && amt !== 0;
  if (!store && !hasAmt) {
    return { entry: null, error: "店名か金額のどちらかは必要です。入力してから承認してください(不要なら「破棄する」で消せます)。" };
  }
  if (String(p.amount).trim() !== "" && isNaN(amt)) {
    return { entry: null, error: "金額は整数(小数点なしの円)で入力してください。例: 1200" };
  }
  if (isNaN(amt)) amt = 0;
  // 回収モードのカードは金額がマイナスでないと回収として扱われない(2026-07-21改修13-2)。
  // プラスのまま記帳すると、未回収も預かり残高も動かない「どこにも紐づかない行」になってしまう
  if (p.collect === true && amt >= 0) {
    return { entry: null, error: "回収はマイナス金額で記録します。金額欄の右の「±」ボタンで符号を切り替えてください。" };
  }
  // 複数請求(2026-07-21改修A): bills を検証。整数でない・Σ請求分>総額 は承認不可(黙って丸めない)
  var pb = parseBillsInput(p, amt);
  if (pb.error) return { entry: null, error: pb.error };
  // 人数(2026-07-21追加): 不正値は1に補正。会食系の科目で2名以上のとき、メモに「○名」を自動追記(重複防止つき)
  var persons = parsePersons(p.persons);
  var memo = String(p.memo || "");
  if (persons >= 2 && amt >= 0 && (p.category === "会議費" || p.category === "接待交際費")) {
    memo = appendPersonsMemo(memo, persons);
  }
  return {
    entry: {
      id: p.id, date: p.date || todayStr(), store: store, amount: amt,
      category: p.category, payment: p.payment, client: String(p.client || "").trim(),
      memo: memo, corrected: p.category !== p.aiCategory,
      bills: pb.bills,
      ghost: p.ghost === true,
      // 立替の回収(2026-07-21改修13-11): 幽霊とは独立して記帳に残す。
      // 幽霊をOFFにしても、未回収からの差し引きは正しく効き続ける
      collect: p.collect === true,
      persons: persons,
      // 自動セットの印を記帳にも保存する(2026-07-21 検証6問題2の修正):
      // 「編集→無変更で保存」でも学習除外が維持されるように、entry に catAuto を持たせる
      catAuto: p.catAuto === true,
      // 学習除外(2026-07-21改修B): 自動セットされた会食科目は店名→科目学習に登録しない(学習の振動防止)
      skipLearn: p.catAuto === true && (p.category === "会議費" || p.category === "接待交際費")
    },

}
var stampTimer = null;
function approveOne(id) {
  var p = null, idx = -1;
  for (var i = 0; i < state.pendings.length; i++) { if (state.pendings[i].id === id) { p = state.pendings[i]; idx = i; break; } }
  if (!p) return;
  var v = validatePending(p);
  if (!v.entry) {
    ui.error = v.error;
    render();
    return;
  }
  var entry = v.entry;
  // マイナス金額は「返金・値引き」の確認を挟んでから記帳する。
  // 請求(立替)が入っているカードをマイナスにすると、その請求は消える(マイナス記帳と併用できない)。
  // 消える金額を必ず確認パネルに出してから確定する(2026-07-21改修13-1)
  var risk = billsRiskSum(p);
  if (ui.negConfirmId === id) {
    // 確定時の再検証: パネル表示後に金額欄が書き換えられていたら、古い表示のまま記帳しない
    if (entry.amount >= 0) {
      // マイナスでなくなっている(空欄=0円扱い・0・プラスに書き換え)。
      // 「マイナスで記帳する」ボタンの文言と実際の金額が食い違うため、確認なしでは記帳しない
      ui.negConfirmId = null;
      ui.negConfirmAmt = null;
      ui.negConfirmBill = 0;
      ui.error = "金額がマイナスではなくなっていたため、記帳を止めました。内容を確認して、もう一度「承認」を押してください。";
      render();
      return;
    }
    if (entry.amount !== ui.negConfirmAmt || risk.sum !== ui.negConfirmBill) {
      // マイナスのまま金額または請求分が変わった → パネルを新しい内容で出し直して確認し直させる
      ui.error = "";
      render();
      return;
    }
    // 表示どおりのマイナス金額・請求分 → 下の確定処理へ進む
  } else if (entry.amount < 0) {
    ui.negConfirmId = id;
    ui.error = "";
    render();
    return;
  }
  ui.error = "";
  ui.negConfirmId = null;
  ui.negConfirmAmt = null;
  ui.negConfirmBill = 0;
  // 記帳はクリックの瞬間に確定する(連打・まとめて承認との二重記帳を防ぐ)。朱印アニメは見た目のみ
  commitEntries([entry]);
  // 押した感(2026-07-21改修E): 対応端末では短く1回振動する。
  // navigator.vibrate を機能判定してから呼ぶ(PC・iOS Safari など非対応環境では何も起きない=エラーにしない)
  try {
    if (typeof navigator.vibrate === "function") navigator.vibrate(40);
  } catch (eVib) { /* 非対応環境では何もしない */ }
  var snap = {};
  for (var k in p) { if (Object.prototype.hasOwnProperty.call(p, k)) snap[k] = p[k]; }
  ui.stampSnapshot = { pending: snap, index: idx };
  ui.stampedId = id;
  render();
  if (stampTimer) clearTimeout(stampTimer);
  stampTimer = setTimeout(function () {
    stampTimer = null;
    ui.stampedId = null;
    ui.stampSnapshot = null;
    render();
  }, 550);
}
// 記帳の確定(単発・まとめて共通)
function commitEntries(list) {
  // 二重記帳ガード: すでに台帳にある id は記帳しない
  var seen = {};
  state.entries.forEach(function (e) { seen[e.id] = 1; });
  list.forEach(function (entry) {
    if (seen[entry.id]) return;
    seen[entry.id] = 1;
    addClientToList(entry.client);
    (entry.bills || []).forEach(function (b) { addClientToList(b.to); }); // 請求先も取引先リストと共用(空なら何もしない)
    // 学習除外(2026-07-21改修B): 自動セットされた会食科目は学習しない。skipLearn は記帳データには残さない
    var skipLearn = entry.skipLearn === true;
    delete entry.skipLearn;
    state.entries.push(entry);
    if (!skipLearn) state.rules = upsertRule(state.rules, entry.store, entry.category);
    state.pendings = state.pendings.filter(function (x) { return x.id !== entry.id; });
  });
  state.entries.sort(function (a, b) { return b.date.localeCompare(a.date); });
  markDirty();
}

}

    } else {

function markBackup() {
  state.lastBackup = todayStr();
  markDirty();
}
function copyText(text, done, fail) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fail);
  } else {
    fail();
  }
}
function copyCsv() {
  copyText(ui.csvText, function () {
    markBackup();
    ui.copyMsg = "コピーしました。Googleドライブや自分宛メールなど、端末の外に貼り付けて控えを保存してください(実施日を記録しました)。";
    render();
  }, function () {
    ui.copyMsg = "自動コピーができませんでした。下の枠をロングタップ→全選択→コピーしてください。";
    render();
  });
}
function downloadCsv() {
  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename: "経理台帳_" + todayStr() + ".txt", data: ui.csvText })
      .then(function () {
        markBackup();
        ui.copyMsg = "保存しました(拡張子は .txt です。Excelで使うときはファイル名の末尾を .csv に変えても、そのままExcelで開いても大丈夫です)。";
        render();
      }, function (err) {
        if (err && err.code === "declined") {
          ui.copyMsg = "保存を取り消しました。";
        } else {
          ui.copyMsg = "ファイル保存ができない環境のようです。「全文をコピー」をお使いください。";
        }
        render();
      });
    return;
  }
  // ブラウザ標準のダウンロード(通常のブラウザで開いている場合)
  try {
    var blob = new Blob([ui.csvText], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "経理台帳_" + todayStr() + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    markBackup();
    ui.copyMsg = "保存を開始しました。";
  } catch (e) {
    ui.copyMsg = "ファイル保存ができませんでした。「全文をコピー」をお使いください。";
  }
  render();
}

// ---------- 削除ログ(2026-07-20追加) ----------
// 外部から来た削除ログを検証・整形する(loadState と JSON復元で共用)。
// 不正な行は捨てず、各項目を安全な値(文字列・整数)に整えて残す
function sanitizeDeletedLog(list) {
  return (Array.isArray(list) ? list : [])
    .filter(function (x) { return x && typeof x === "object"; })
    .map(function (x) {
      var amt = Number(x.amount);
      return {
        deletedAt: /^\d{4}-\d{2}-\d{2}$/.test(String(x.deletedAt || "")) ? String(x.deletedAt) : todayStr(),
        date: /^\d{4}-\d{2}-\d{2}$/.test(String(x.date || "")) ? String(x.date) : "",
        store: String(x.store || ""),
        amount: Number.isSafeInteger(amt) ? amt : 0,
        category: String(x.category || ""),
        memo: String(x.memo || "")
      };
    });
}
// チャットに貼る用のテキスト。1行目にお願い文、2行目以降はCSV(削除日,日付,店名,金額,科目,メモ)

// 復元する記帳1行の検証・整形。金額が整数でない等の不正があれば null(不合格)
// 複数請求(2026-07-21改修A): bills 配列を正とする。旧形式(billAmount 等4フィールド)は
// 読み込み時に bills 1件へ自動変換する(旧データ互換。変換後は旧フィールドを保存しない)
function sanitizeEntry(e) {
  if (!e || typeof e !== "object") return null;
  var amt = Number(e.amount);
  if (!Number.isSafeInteger(amt)) return null;
  var date = String(e.date || "");
  var bills = [];
  if (Array.isArray(e.bills)) {
    // 新形式: 各明細を厳密に検証。不正(整数でない・1円未満・Σ>総額)は行ごと不合格(黙って作り変えない)
    for (var i = 0; i < e.bills.length; i++) {
      var b = e.bills[i];
      if (!b || typeof b !== "object") return null;
      var ba = Number(b.amount);
      if (!Number.isSafeInteger(ba) || ba < 1) return null;
      var st = b.status === "paid" ? "paid" : "unpaid";
      bills.push({
        to: cleanBillName(b.to),
        amount: ba,
        status: st,
        paidDate: st === "paid"
          ? (/^\d{4}-\d{2}-\d{2}$/.test(String(b.paidDate || "")) ? String(b.paidDate) : todayStr())
          : "",
        // 回収行からの自動反映(2026-07-21改修11-7): paidBy=消し込んだ回収行のid / autoSkip=手動で取り消したので自動対象外
        // paidAmt=一部回収の回収済み額(0〜請求額。満額なら status="paid" 側で表す)
        paidBy: typeof b.paidBy === "string" ? b.paidBy : "",
        autoSkip: b.autoSkip === true,
        paidAmt: (function (v) {
          var n = Number(v);
          if (!Number.isSafeInteger(n) || n < 0) return 0;
          return n > ba ? ba : n;
        })(b.paidAmt),
        // paidManual=手動で「回収済みにする」を押したぶん(2026-07-21改修13-3)。
        // 自動充当ぶんと分けて持ち、applyCollections の取り消し(①)でも残す
        paidManual: (function (v) {
          var n = Number(v);
          if (!Number.isSafeInteger(n) || n < 0) return 0;
          return n > ba ? ba : n;
        })(b.paidManual)
      });
    }
    if (amt < 0) bills = [];                    // マイナス記帳(返金・値引き)と請求の併用は不可
    else if (billSum(bills) > amt) return null; // Σ請求分 ≦ 総額 を満たさない行は不合格
  } else {
    // 旧形式(単一bill)の自動変換。丸め方は旧仕様のまま(整数でない・負→0、総額超→総額に丸め)
    var bill = Number(e.billAmount == null ? 0 : e.billAmount);
    if (!Number.isSafeInteger(bill) || bill < 0) bill = 0;
    if (amt < 0) bill = 0;
    else if (bill > amt) bill = amt;
    if (bill > 0) {
      var bs = e.billStatus === "paid" ? "paid" : "unpaid";
      bills = [{
        to: cleanBillName(e.billTo),
        amount: bill,
        status: bs,
        paidDate: bs === "paid"
          ? (/^\d{4}-\d{2}-\d{2}$/.test(String(e.billPaidDate || "")) ? String(e.billPaidDate) : todayStr())
          : ""
      }];
    }
  }
  return {
    id: String(e.id || newId()),
    date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : todayStr(),
    store: String(e.store || ""),
    amount: amt,
    category: CATEGORIES.indexOf(e.category) !== -1 ? e.category : "雑費",
    payment: PAYMENTS.indexOf(e.payment) !== -1 ? e.payment : "現金",
    client: String(e.client || ""),
    memo: String(e.memo || ""),
    corrected: !!e.corrected,
    bills: bills,
    // 幽霊(2026-07-21改修D): true の行はCSV書き出しから除外(表示・集計・JSON控えには含む)。true 以外はすべて false
    ghost: e.ghost === true,
    // 立替の回収(2026-07-21改修13-11): 幽霊とは別の独立したフラグ。
    // 旧データ(このフィールドが無い)は、これまでの判定(幽霊ON+マイナス+取引先あり)で回収とみなして引き継ぐ。
    // 明示的に false が入っている行は、そのまま「回収ではない」を尊重する(勝手に回収へ戻さない)
    collect: typeof e.collect === "boolean"
      ? e.collect
      : (e.ghost === true && amt < 0 && String(e.client || "").trim() !== ""),
    // 自動セット科目の印(2026-07-21 検証6問題2の修正): 学習除外の維持に使う。旧データ(フィールド無し)は false
    catAuto: e.catAuto === true,
    // 人数(2026-07-21追加): 旧データ(フィールド無し)・不正値は1に補完(整数1〜999のみ許可)
    persons: parsePersons(e.persons),
    // 回収行が実際に消し込んだ金額(2026-07-21改修11-7)。applyCollections が毎回計算し直すので、
    // 旧データ・不正値は0でよい(表示用の印)
    collectApplied: Number.isSafeInteger(Number(e.collectApplied)) ? Number(e.collectApplied) : 0,
    collectUnused: Number.isSafeInteger(Number(e.collectUnused)) ? Number(e.collectUnused) : 0
  };
}
function importJson() {
  var el = document.getElementById("jsonImportText");
  var text = el ? el.value.trim() : "";
  if (!text) {
    ui.jsonMsg = "復元するJSONを上の枠に貼り付けてください。";
    renderPage();
    return;
  }
  var d = null;
  try { d = JSON.parse(text); } catch (e) { d = null; }
  if (!d || typeof d !== "object" || !Array.isArray(d.entries) || !Array.isArray(d.rules)) {
    ui.jsonMsg = "復元できませんでした。JSONが壊れているか、形式が違います(既存のデータは変えていません)。";
    renderPage();
    return;
  }
  // 全行を検証。1件でも不正があれば復元を中止する(経理データを黙って作り変えない)
  var cleaned = d.entries.map(sanitizeEntry);
  var bad = 0;
  cleaned.forEach(function (x) { if (x === null) bad++; });
  if (bad > 0) {
    ui.jsonMsg = "復元を中止しました。金額などが不正な記帳が " + bad + " 件あります(既存のデータは変えていません)。";
    renderPage();
    return;
  }
  var cleanRules = d.rules.filter(function (r) {
    return r && typeof r === "object" && typeof r.store === "string" && typeof r.category === "string";
  }).map(function (r) {
    return {
      key: normalize(r.store),
      store: r.store,
      category: CATEGORIES.indexOf(r.category) !== -1 ? r.category : "雑費",
      count: Number.isSafeInteger(Number(r.count)) ? Number(r.count) : 1
    };
  });
  // 復元前に現在のデータを1世代前バックアップへ退避
  try {
    var prev = localStorage.getItem(STORAGE_KEY);
    if (prev !== null) localStorage.setItem(BACKUP_KEY, prev);
  } catch (e) { /* 退避失敗でも復元は続行 */ }
  state.entries = cleaned;
  state.rules = cleanRules;
  state.pendings = Array.isArray(d.pendings)
    ? d.pendings.filter(function (p) { return p && typeof p === "object"; }).map(migratePendingBills)
    : [];
  state.clientList = sanitizeClientList(d.clientList);
  state.editDraft = (d.editDraft && typeof d.editDraft === "object") ? d.editDraft : null;
  if (state.editDraft) {
    var draftWasOld = !Array.isArray(state.editDraft.bills);
    migratePendingBills(state.editDraft);
    state.editDraft.id = String(state.editDraft.id);
    syncDraftBillsFromEntry(draftWasOld);
  }
  state.lastBackup = d.lastBackup || "";
  // 最終保存時刻(2026-07-21追加): 控えに無い(古い控えの)場合は今の値を保持(直後の自動保存で更新される)
  state.lastSavedAt = typeof d.lastSavedAt === "string" ? d.lastSavedAt : state.lastSavedAt;
  // 削除ログ(2026-07-20追加): 控えに無い(この機能より古い控えの)場合は、今のログを保持する
  // (原本写真の整理待ちの記録を、復元操作で失わないため)
  state.deletedLog = Array.isArray(d.deletedLog) ? sanitizeDeletedLog(d.deletedLog) : state.deletedLog;
  state.entries.forEach(function (e) { e.id = String(e.id); });
  state.pendings.forEach(function (p) { p.id = String(p.id); });
  if (el) el.value = "";
  ui.jsonMsg = "復元しました(記帳" + state.entries.length + "件)。";
  markDirty();
  render();
  renderPage();
}

// ---------- 保存セルフテスト ----------
function runSelfTest() {
  try {
    var key = "keiri-selftest";
    var stamp = "test-" + Date.now();
    localStorage.setItem(key, stamp);
    var back = localStorage.getItem(key);
    localStorage.removeItem(key);
    ui.selfTestMsg = (back === stamp)
      ? "保存テスト: 成功(このブラウザで保存・読み込みとも正常に動いています)※このテストは「いま保存できるか」の確認だけで、7日後や機種変更後にデータが残る保証ではありません。控えは別途、端末の外へ残してください。"
      : "保存テスト: 異常(保存した値と読み込んだ値が違います)";
  } catch (e) {
    ui.selfTestMsg = "保存テスト: 失敗(" + (e && e.message ? e.message : "不明") + ")。プライベートブラウズ中は保存できないことがあります。";
  }
  renderPage();
}

function selectHtml(options, selected, attr) {
  return '<select ' + attr + '>' + options.map(function (o) {
    return '<option value="' + esc(o) + '"' + (o === selected ? " selected" : "") + '>' + esc(o) + '</option>';
  }).join("") + '</select>';
}
function clientSelectHtml(current, onchangeAttr) {
  var list = state.clientList.slice();
  var extra = "";
  if (current && list.indexOf(current) === -1) {
    extra = '<option value="' + esc(current) + '" selected>' + esc(current) + '</option>';
  }
  return '<select ' + onchangeAttr + '>'
    + '<option value=""' + (!current ? " selected" : "") + '>(指定なし)</option>'
    + extra
    + list.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === current ? " selected" : "") + '>' + esc(c) + '</option>';
    }).join("")
    + '<option value="__ADD__">＋ 新しい取引先を入力</option>'
    + '</select>';
}

function renderSummary() {
  var thisMonth = todayStr().slice(0, 7);
  var total = 0, ghostSum = 0;
  state.entries.forEach(function (e) {
    if (String(e.date || "").slice(0, 7) === thisMonth) {
      total += entryOwn(e);
      if (e.ghost === true) ghostSum += entryOwn(e);
    }
  });
  document.getElementById("summary").innerHTML =
    '<div class="summary"><span class="label">' + esc(monthLabel(thisMonth)) + 'の経費(自分負担)</span>'
    + '<span class="amount' + (total < 0 ? ' amount-minus' : '') + '">' + esc(yenDisp(total)) + '</span>'
    + (ghostSum !== 0 ? '<span class="ghost-note">うち幽霊(CSV除外) ' + esc(yenDisp(ghostSum)) + '</span>' : '')
    + '</div>';
}

// 保存バー(2026-07-21 ユーザー指示): 手動保存ボタン+最終保存時刻+「未保存の変更あり」の常時表示。
// 起動時に保存データが空だった場合は、データ消失にすぐ気づけるよう目立つ警告を出す
function renderSaveBar() {
  var el = document.getElementById("saveBar");
  if (!el) return;
  var status;
  if (ui.justSavedMsg && !ui.dirty) {
    status = '<span class="save-done">✓ ' + esc(ui.justSavedMsg) + '</span>';
  } else if (state.lastSavedAt) {
    status = '<span class="save-time">' + esc((ui.savedThisSession ? "最終保存: " : "前回保存: ") + stampDisp(state.lastSavedAt)) + '</span>';
  } else {
    status = '<span class="save-time">まだ保存されていません</span>';
  }
  if (ui.dirty) status += '<span class="save-dirty">未保存の変更あり</span>';
  var h = '<div class="save-bar"><button class="save-btn" data-act="save-now">保存</button>'
    + '<div class="save-status">' + status + '</div></div>';
  if (ui.noSavedData) {
    h += '<div class="notice notice-error"><div class="n-head"><span class="warn-ic sm">!</span><span>'
      + esc("保存データが見つかりません。初めての起動でなければ、設定ページのJSON控え(「JSONを貼り付けて復元」)から復元してください。")
      + '</span></div></div>';
  }
  el.innerHTML = h;
}

function renderNotices() {
  var h = "";
  // 控えの状態表示(2026-07-20補強・壁打ち補強案1,2): 常時表示+段階化(7日で黄・60日で赤)。
  // 推奨する控えは、丸ごと戻せる「JSON控え」に統一。
  // 「控えの後の記帳」は、記帳の日付が最終控え日より後のものを数えた概算(日付ベースの目安)
  if (state.entries.length > 0) {
    var backupDays = state.lastBackup
      ? Math.floor((new Date(todayStr()) - new Date(state.lastBackup)) / 86400000)
      : null;
    var cnt = 0, sum = 0;
    state.entries.forEach(function (e) {
      if (!state.lastBackup || String(e.date || "") > state.lastBackup) { cnt++; sum += entryOwn(e); }
    });
    var risk = cnt > 0 ? "控えの後の記帳 " + cnt + "件(自分負担 " + yenDisp(sum) + ")は、まだこの端末にしかありません。" : "";
    var advice = "週1回(月曜が控えの日)、設定ページの「JSONをコピー」で、Googleドライブやメールなど端末の外へ控えてください(帳簿は7年保存が原則)。";
    if (backupDays === null) {
      h += '<div class="notice notice-warn"><div class="n-head"><span class="warn-ic sm">!</span><span>' + esc("まだ控え(バックアップ)を取っていません。" + risk + " " + advice) + '</span></div></div>';
    } else if (backupDays >= 60) {
      h += '<div class="notice notice-error"><div class="n-head"><span class="warn-ic sm">!</span><span>' + esc("最後の控えから" + backupDays + "日経っています。" + risk + " 今すぐ設定ページの「JSONをコピー」で、端末の外へ控えを取ってください。") + '</span></div></div>';
    } else if (backupDays >= 7) {
      h += '<div class="notice notice-warn"><div class="n-head"><span class="warn-ic sm">!</span><span>' + esc("最後の控えから" + backupDays + "日経っています。" + risk + " " + advice) + '</span></div></div>';
    } else {
      h += '<div class="notice notice-info" style="font-size:14px;">' + esc("最後の控え: " + state.lastBackup + "(" + backupDays + "日前)。" + risk) + '</div>';
    }
  }
  if (ui.saveError) {
    h += '<div class="notice notice-error"><div class="n-head"><span class="warn-ic sm">!</span><span>' + esc(ui.saveError) + '</span></div>'
      + '<button class="inline-act" data-act="retry-save">今すぐ再保存する</button></div>';
  }
  if (ui.error) {
    h += '<div class="notice notice-error"><div class="n-head"><span class="warn-ic sm">!</span><span>' + esc(ui.error) + '</span></div></div>';
  }
  if (ui.info) {
    h += '<div class="notice notice-info">' + esc(ui.info) + '</div>';
    ui.info = "";
  }
  document.getElementById("notices").innerHTML = h;
}

// ---------- 割り勘・立替(複数請求・2026-07-21改修A) ----------
// scope: "pending"(承認待ちカード) | "draft"(編集フォーム)
function billTargetOf(scope, id) {
  return scope === "draft" ? state.editDraft : findPendingById(id);
}
// 請求先チップのタップ(選択/解除)。選択時は 1人あたり額(総額÷人数の切り捨て)を自動セットする。
// 選べるのは最大 人数−1 名(人数1のときは1名=会社への全額請求などのため)。端数は自分負担に寄る
function billToToggle(scope, id, name) {
  var t = billTargetOf(scope, id);
  if (!t) return;
  var key = scope === "draft" ? "__draft__" : id;
  if (!Array.isArray(t.bills)) t.bills = [];
  var bills = t.bills;
  var idx = -1;
  for (var i = 0; i < bills.length; i++) { if (bills[i].to === name) { idx = i; break; } }
  if (idx >= 0) {
    bills.splice(idx, 1); // もう一度タップで解除
  } else {
    var p = parsePersons(t.persons);
    var cap = Math.max(1, p - 1);
    if (bills.length >= cap) {
      ui.error = "請求先は最大 " + cap + " 名(人数−1名。人数1のときは1名)までです。先に人数を増やすか、他の請求先を外してください。";
      render();
      return;
    }
    var amt = parseAmount(t.amount);
    var auto = "";
    if (!isNaN(amt) && amt > 0) auto = String(Math.floor(amt / p)); // 1人あたり=総額÷人数の切り捨て
    bills.push({ to: name, amount: auto, status: "unpaid", paidDate: "" });
  }
  ui.billOpen[key] = true;
  ui.error = "";
  markDirty();
  render();
}
// 「全額(会社など)」: 選択中の請求先1名に総額をセット(bills=[{to:会社名, amount:総額}]。自分負担0円)
function billFull(scope, id) {
  var t = billTargetOf(scope, id);
  if (!t) return;
  var amt = parseAmount(t.amount);
  if (isNaN(amt) || amt <= 0) {
    ui.error = "先に金額(総額)を正の整数で入力してから、「全額」ボタンを使ってください。";
    render();
    return;
  }
  var bills = Array.isArray(t.bills) ? t.bills : (t.bills = []);
  if (bills.length === 0) {
    ui.error = "先に請求先チップから、請求する相手(会社名など)を1つ選んでください。";
    render();
    return;
  }
  if (bills.length >= 2) {
    ui.error = "「全額」は請求先が1名のときに使えます(全額をひとりに請求するボタンです)。請求先を1つにしてから押してください。";
    render();
    return;
  }
  bills[0].amount = String(amt);
  ui.billOpen[scope === "draft" ? "__draft__" : id] = true;
  ui.error = "";
  markDirty();
  render();
}
// 新しい請求先名の入力欄をひらく/確定する
function billToAddOpen(scope, id) {
  var t = billTargetOf(scope, id);
  if (!t) return;
  t.billToAdding = true;
  ui.billOpen[scope === "draft" ? "__draft__" : id] = true;
  markDirty();
  render();
}
function billToAddGo(scope, id) {
  var t = billTargetOf(scope, id);
  if (!t) return;
  var name = cleanBillName(t.billToNew);
  if (!name) {
    ui.error = "新しい請求先の名前を入力してください。";
    render();
    return;
  }
  t.billToNew = "";
  t.billToAdding = false;
  var exists = (t.bills || []).some(function (b) { return b.to === name; });
  if (exists) { markDirty(); render(); return; }
  billToToggle(scope, id, name); // 選択と同じ流れで追加(人数上限チェック・1人あたり自動セット込み)
}
// ---------- 回収行の自動反映(2026-07-21改修11-7、検証8で11-8に改訂) ----------
// 回収行 = 幽霊ON + 金額マイナス + 取引先あり の記帳(PayPay等で立替金を受け取った記録)。
// その取引先への未回収の請求(bills)を、古い日付順に「回収額(絶対値)ぶん」だけ自動で消し込む。
//
// 【二重反映を防ぐ考え方】差し引きを1回きりの操作にせず、毎回ゼロから計算し直す(冪等)。
//   ① 自動で消し込んだ印(paidBy=回収行のid)が付いた bills を、いったんすべて未回収に戻す
//   ② 回収行を日付順に見て、対象の未回収 bills へ古い順に割り当て直す
// これにより、再描画・再読み込み・何度呼んでも結果は同じ(多重に差し引かれない)。
// 回収行を削除・幽霊解除・金額変更したときも、次の計算で自動的に正しい状態へ戻る。
//
// 【日付のきまり(検証8 問題1の修正)】
//   ・消し込めるのは **回収行の日付以前の立替だけ**。回収日より後の立替には決して割り当てない
//     (まだ受け取っていないお金が「回収済み」になるのを防ぐ)
//   ・使い切れなかった回収額は **その場で捨てる**(次回・将来の立替へ繰り越さない)
//   ・回収日(paidDate)は回収行の日付。対象を「回収日以前の立替」に限るので、
//     回収日が立替日より前になることはない
//
// 【一部回収(検証8 問題2の修正)】
//   ・請求1件を満額そろえられなくても、足りるぶんだけ充当する(bills[].paidAmt = 回収済み額)
//   ・未回収残 = 請求額 − 回収済み額。満額に達したときだけ status="paid" にする
//
// 【手動操作との併用】
//   ・手動で回収済みにしたぶんは paidManual に別枠で持つ。①で取り消すのは自動充当ぶんだけ(手動ぶんは残す)
//   ・自動で消し込んだ bill を手動で「取り消す」と autoSkip=true が付き、以後その bill は自動反映の対象外
//   ・消し込めるのは実在の請求額までなので、回収済みの合計が立替累計を超えることはない
//
// 【手動「回収済みにする」の決まり(2026-07-21改修13-3・検証9 問題3の修正)】
//   ・手動で回収済みにするのは **未回収残(請求額 − 回収済み額)だけ**。すでに回収行から自動充当されている
//     ぶんはそのまま残す(paidBy を消さない)
//   ・こうしないと自動充当ぶんが回収行から押し出され、同じ金額が「回収済み」と「預かり残高」の
//     両方に数えられてしまう(例: 請求4,333・自動充当4,300 → 手動で満額にすると4,300が預かり残高へ)
// 回収行の判定(2026-07-21改修13-11・検証10 問題1の修正)。
// 【幽霊(CSV除外)とは切り離す】幽霊は「確定申告用CSVに出すかどうか」だけを決める印なので、
// 回収かどうかの判定に使ってはいけない(幽霊をOFFにした瞬間に未回収からの差し引きが止まっていた)。
// 回収であることは独立した collect フラグで持ち、保存・編集・JSON往復・サニタイズで引き継ぐ。
function isCollectionEntry(e) {
  return e && e.collect === true && Number(e.amount) < 0 && String(e.client || "").trim() !== "";
}
// 請求1件の回収済み額(満額回収なら請求額そのもの・一部回収なら paidAmt)
function billPaidAmt(b) {
  if (!b) return 0;
  if (b.status === "paid") return Number(b.amount) || 0;
  var p = Number(b.paidAmt);
  if (!Number.isSafeInteger(p) || p < 0) return 0;
  var a = Number(b.amount) || 0;
  return p > a ? a : p;
}
// 請求1件の未回収残 = 請求額 − 回収済み額
function billRemain(b) {
  return (Number(b && b.amount) || 0) - billPaidAmt(b);
}
// 請求1件のうち「手動で回収済みにした額」(2026-07-21改修13-3)。0〜請求額に丸める
function billManualAmt(b) {
  if (!b) return 0;
  var a = Number(b.amount) || 0;
  var m = Number(b.paidManual);
  if (!Number.isSafeInteger(m) || m < 0) return 0;
  return m > a ? a : m;
}
// 手動で「回収済みにする」(2026-07-21改修13-3・検証9 問題3の修正)。
// 自動充当ぶん(paidBy/paidAmt)はそのまま残し、未回収残だけを手動ぶんとして足す。
// paidBy を消さないので、回収行の充当が押し出されて預かり残高へ回ることがない
function markBillPaidManual(b, dateStr) {
  var amount = Number(b.amount) || 0;
  var already = billPaidAmt(b);          // いまの回収済み額(自動充当ぶんを含む)
  var rest = amount - already;           // 未回収残(ここだけを手動で回収済みにする)
  if (rest < 0) rest = 0;
  b.paidManual = billManualAmt(b) + rest;
  b.paidAmt = already + rest;            // = 請求額(満額)
  b.status = "paid";
  b.paidDate = dateStr;
}
// 回収済みを取り消す。
// ・手動ぶんがある請求 … 手動で足したぶんだけを取り消す(回収行からの自動充当はこのあと再計算で戻る)
// ・手動ぶんが無い(自動だけで回収済み)請求 … 以後この請求を自動反映の対象外にする(取消が効かなくなるのを防ぐ)
function clearBillPaid(b) {
  var hadManual = billManualAmt(b) > 0;
  if (!hadManual && b.paidBy) b.autoSkip = true;
  b.status = "unpaid";
  b.paidDate = "";
  b.paidBy = "";
  b.paidAmt = 0;
  b.paidManual = 0;
}

// ---------- 預かり残高(2026-07-21改修12・表示のみ) ----------
// 相手から多めに受け取った分(=充当先のなかった回収額 collectUnused)を取引先ごとに合計した数字。
// 【あえて充当しない】自動でも手動でも次の立替には充てない。充ててしまうと、まだ受け取っていない
//   立替が「回収済み」に見えてしまうため。次回の精算時に、この残高を見て受取額を調整してもらう。
// 【保存しない】applyCollections が毎回ゼロから作り直す(冪等)。保存データに新しい項目は増やさない。
// 【別枠の数字】「立替累計 − 回収済み = 未回収残」の式には一切関わらない(未回収残を減らさない)。
var depositMap = {};
// 取引先1件の預かり残高
function depositOf(name) {
  return depositMap[cleanBillName(name)] || 0;
}
// 預かり残高の一覧 [{name, amt}](多い順)。names に配列を渡すとその取引先だけに絞る(空/未指定=すべて)
function depositList(names) {
  var only = Array.isArray(names) && names.length > 0
    ? names.map(function (n) { return cleanBillName(n); }) : null;
  return Object.keys(depositMap)
    .filter(function (k) { return depositMap[k] > 0 && (!only || only.indexOf(k) !== -1); })
    .map(function (k) { return { name: k, amt: depositMap[k] }; })
    .sort(function (a, b) { return b.amt - a.amt || a.name.localeCompare(b.name); });
}
// 預かり残高の合計(names の絞り込みは depositList と同じ)
function depositTotal(names) {
  var s = 0;
  depositList(names).forEach(function (d) { s += d.amt; });
  return s;
}
function applyCollections() {
  depositMap = {}; // 預かり残高もここでゼロから作り直す(二重計上しない)
  // ① 自動反映ぶんをいったん取り消す(手動で回収済みにした paidManual は残す・2026-07-21改修13-3)
  state.entries.forEach(function (e) {
    (Array.isArray(e.bills) ? e.bills : []).forEach(function (b) {
      if (!b.paidBy) return;                 // 手動だけの請求はさわらない(手動が優先)
      var man = billManualAmt(b);            // 手動で回収済みにしたぶんは戻さない
      b.paidBy = "";
      b.paidAmt = man;
      if (man > 0 && man >= (Number(b.amount) || 0)) {
        b.status = "paid";                   // 手動だけで満額 → 回収日(手動の日付)もそのまま
      } else {
        b.status = "unpaid";
        b.paidDate = "";
      }
    });
    if (e.collectApplied) e.collectApplied = 0;
  });
  // ② 回収行を古い順に見て、その取引先の未回収へ割り当て直す
  var rows = state.entries.filter(isCollectionEntry).slice().sort(function (a, b) {
    return String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id));
  });
  rows.forEach(function (c) {
    var name = cleanBillName(c.client);
    var cDate = String(c.date || "");
    var remain = Math.abs(Number(c.amount) || 0);
    var applied = 0;
    var targets = [];
    state.entries.forEach(function (e) {
      (Array.isArray(e.bills) ? e.bills : []).forEach(function (b) {
        // 回収日より後の立替は対象外(まだ受け取っていないお金なので消し込まない)
        if (String(e.date || "") > cDate) return;
        if (b.autoSkip === true || cleanBillName(b.to) !== name) return;
        if (billRemain(b) <= 0) return; // 満額回収済み(手動ぶんを含む)は対象外
        targets.push({ e: e, b: b });
      });
    });
    targets.sort(function (x, y) {
      return String(x.e.date).localeCompare(String(y.e.date)) || String(x.e.id).localeCompare(String(y.e.id));
    });
    targets.forEach(function (t) {
      if (remain <= 0) return;
      var rest = billRemain(t.b);
      var take = remain < rest ? remain : rest; // 足りなければ足りるぶんだけ充当(一部回収)
      if (take <= 0) return;
      t.b.paidAmt = billPaidAmt(t.b) + take;
      t.b.paidBy = c.id;
      if (t.b.paidAmt >= Number(t.b.amount)) {
        t.b.status = "paid";
        t.b.paidDate = cDate;
      }
      remain -= take;
      applied += take;
    });
    // 使い切れなかった回収額(remain)は立替へは充てない。取引先ごとの「預かり残高」として表示するだけ
    c.collectApplied = applied; // 反映済みの印(この回収行が実際に消し込んだ金額)
    c.collectUnused = remain;   // 充当できなかった額(表示用。桁の打ち間違いに気づく手がかり)
    if (remain > 0) depositMap[name] = (depositMap[name] || 0) + remain; // 預かり残高へ加算(表示のみ)
  });
}

// 回収済みの達成演出(2026-07-21改修11-6): 承認印と同じ様式の「済」スタンプ+対応端末で振動。
// render() で消えないよう body 直下に別レイヤーで出し、約0.7秒で自分から消える(操作はブロックしない)
var paidStampTimer = null;
function showPaidStamp() {
  try {
    var old = document.getElementById("paidStampLayer");
    if (old) old.remove();
    var layer = document.createElement("div");
    layer.id = "paidStampLayer";
    layer.className = "paid-stamp-layer";
    layer.setAttribute("aria-hidden", "true");
    layer.innerHTML = '<div class="stamp-mark">済</div>';
    document.body.appendChild(layer);
    if (paidStampTimer) clearTimeout(paidStampTimer);
    paidStampTimer = setTimeout(function () {
      paidStampTimer = null;

  } catch (e) { /* 演出が出せなくても処理は続ける */ }
  // 押した感: 対応端末では短い振動(非対応でも何も起きない)
  try {

}
// 回収済みにする/取り消す(bills の明細単位)。※経費集計(自分負担)には一切影響しない
function setBillStatus(id, bidx, paid) {
  for (var i = 0; i < state.entries.length; i++) {
    var e = state.entries[i];
    if (e.id === id) {
      var b = (e.bills || [])[bidx];
      if (!b) return;
      // 回収済みにする = 未回収残だけを手動ぶんとして加える(自動充当ぶんはそのまま・2026-07-21改修13-3)。
      // 取り消す = 手動・自動どちらのぶんも消して未回収に戻す(以後この請求は自動反映の対象外)
      if (paid) markBillPaidManual(b, todayStr());
      else clearBillPaid(b);
      break;
    }
  }
  markDirty();
  render();
  renderPage();
  if (paid) showPaidStamp(); // 達成演出(取り消しのときは出さない)

// 請求先ごとにまとめて回収済みにする(月ページ内。label は表示名。「(請求先なし)」も対象にできる)
function markBillPaidGroup(label, month) {
  var today = todayStr();
  var hit = 0;
  state.entries.forEach(function (e) {
    if (String(e.date || "").slice(0, 7) !== month) return;
    (e.bills || []).forEach(function (b) {
      if (b.status !== "paid" && (b.to || "(請求先なし)") === label) {
        // まとめ回収も未回収残だけを手動ぶんに加える(自動充当は押し出さない・2026-07-21改修13-3)
        markBillPaidManual(b, today);
        hit++;
      }
    });
  });
  markDirty();
  render();
  renderPage();
  if (hit > 0) showPaidStamp(); // 達成演出(請求先まとめ回収)
}
// 月まとめ回収(2026-07-21改修C): collect=true でその月の未回収明細を全件回収済み(回収日=当日)に。
// collect=false(取消)はその月の回収済み明細を全件未回収に戻す(個別に回収済みにした分も戻る=確認表示で明記)
function collectMonth(month, collect) {
  var today = todayStr();
  var hit = 0;
  state.entries.forEach(function (e) {
    if (String(e.date || "").slice(0, 7) !== month) return;
    (e.bills || []).forEach(function (b) {
      if (collect && b.status !== "paid") {
        // 月まとめ回収も未回収残だけを手動ぶんに加える(自動充当は押し出さない・2026-07-21改修13-3)
        markBillPaidManual(b, today);
        hit++;
      } else if (!collect && b.status === "paid") {
        clearBillPaid(b);
      }
    });
  });
  ui.billsCollectConfirm = null;
  markDirty();
  render();
  renderPage();
  if (collect && hit > 0) showPaidStamp(); // 達成演出(月まとめ回収。取消のときは出さない)
}
// 自分負担表示(入力中はこの部分だけ差し替える)

// 改修B: 人数を選んだとき会議費⇄接待交際費を自動セットする(旧「判定提案ボタン」は廃止。手動選択が最優先)
function findPendingById(id) {
  for (var i = 0; i < state.pendings.length; i++) {

function personsCalcId(scope, id) {

// 計算・判定部分のHTML(金額・人数の入力中は、この部分だけを差し替えて更新する)
function personsCalcHtml(scope, id, obj, dis) {
  var amt = parseAmount(obj.amount);
  if (isNaN(amt) || amt <= 0) {
    return ''; // 金額が入るまでは何も出さない(2026-07-21改修12-3: カード上の文章を減らす)
  }
  var p = parsePersons(obj.persons);
  var per = Math.floor(amt / p);                 // 1人あたり = 総額÷人数 の切り捨て(端数は自分負担に寄る)
  var isKaigi = amt <= 5000 * p;                 // 判定は 総額 ≦ 5,000×人数 の整数比較のみ
  var judged = isKaigi ? "会議費" : "接待交際費";
  var h = '<div class="p-calc num">1人あたり ' + esc(yen(per)) + '(' + p + '名)</div>'
    + (isKaigi
      ? '<div class="p-judge j-kaigi">→ <span class="shape">●</span>会議費の範囲(5,000円/人以下)</div>'

  }
  return h;
}

function signFlip(scope, id) {
  var t = billTargetOf(scope, id);
  if (!t) return;
  var raw = String(t.amount == null ? "" : t.amount).trim();
  var head = raw.charAt(0);

  markDirty();
  render();
  // 金額欄にカーソルを戻す(続けて入力できるように)

    var el = document.querySelector(sel);
    if (el && el.focus) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); }
  } catch (e) { /* 取得できなくても動作に影響しない */ }
}

// 人数連動の自動セット(2026-07-21改修B): 総額≦5,000×人数 の整数比較で会議費⇄接待交際費を切り替える。
// この2科目間のみ(他の科目は人数を変えても勝手に変わらない)。手動で科目を選んだ行では以降自動セットしない。
// 自動セットした行は catAuto=true になり、承認・保存時の店名→科目学習から除外される(学習の振動防止)
function autoSetCat(obj) {
  if (!obj || obj.catManual === true) return;
  if (obj.category !== "会議費" && obj.category !== "接待交際費") return;
  var amt = parseAmount(obj.amount);
  if (isNaN(amt) || amt <= 0) return;
  var judged = amt <= 5000 * parsePersons(obj.persons) ? "会議費" : "接待交際費";
  if (obj.category !== judged) {
    obj.category = judged;
    obj.catAuto = true;
  }
}

function renderBreakdown() {
  var el = document.getElementById("breakdown");
  if (state.entries.length === 0) { el.innerHTML = ""; return; }
  var source = getFilteredEntries().filter(function (e) {
    return ui.viewYear === "all" || String(e.date || "").indexOf(ui.viewYear) === 0;
  });
  var by = {};
  // 自分負担ベース(総額−Σ請求分)で集計する。確定申告への転記はこの数字を使う
  var ghostSum = 0;
  source.forEach(function (e) {
    by[e.category] = (by[e.category] || 0) + entryOwn(e);
    if (e.ghost === true) ghostSum += entryOwn(e); // 幽霊(2026-07-21改修D): 集計には含み、注記を出す
  });
  var rows = Object.keys(by).map(function (k) { return [k, by[k]]; })
    .sort(function (a, b) { return b[1] - a[1]; });
  var title = (ui.viewClients.length === 0 ? "科目別集計"
    : (ui.viewClients.length === 1 ? esc(ui.viewClients[0]) + "の科目別集計" : "選択中の取引先(" + ui.viewClients.length + "件)の科目別集計"))
    + (ui.viewYear !== "all" ? "(" + esc(ui.viewYear) + "年)" : "");
  var h = '<div class="breakdown"><h3>' + title + '</h3>';
  if (rows.length === 0) {
    h += '<div style="font-size:14px;color:var(--sub);font-weight:700;">この条件の記帳はまだありません</div>';
  } else {
    var total = 0;
    rows.forEach(function (r) {
      total += r[1];
      h += '<div class="row">' + catTagHtml(r[0]) + '<span class="val' + (r[1] < 0 ? ' amount-minus' : '') + '">' + esc(yenDisp(r[1])) + '</span></div>';
    });
    h += '<div class="total"><span>合計</span><span class="val' + (total < 0 ? ' amount-minus' : '') + '">' + esc(yenDisp(total)) + '</span></div>';
    if (ghostSum !== 0) {
      h += '<div class="ghost-note">うち幽霊(CSV除外) ' + esc(yenDisp(ghostSum)) + ' — CSV書き出しには含まれません</div>';
    }
  }
  h += '</div>';
  // 立替の月別累計(2026-07-21改修C、改修11-2で「すべて」でも表示)。
  // 科目別集計は entry.client(取引先列)を見るが、この累計は bills[].to(請求先)を見る(対象フィールドが違う)。
  // 取引先を選択中 … その請求先だけ / 未選択(すべて)… 全請求先を合算。
  // 月ごとに 立替累計Σ・回収済みΣ・未回収残(=立替−回収済み)を必ず3つ並べ、最後に全体合計も出す(すべて整数の足し算・引き算のみ)
  var advAll = ui.viewClients.length === 0;
  var adv = {};
  state.entries.forEach(function (e) {
    (Array.isArray(e.bills) ? e.bills : []).forEach(function (b) {
      if (!advAll && ui.viewClients.indexOf(b.to || "") === -1) return;
      var ym = String(e.date || "").slice(0, 7);
      var a = adv[ym] = adv[ym] || { total: 0, paid: 0 };
      a.total += b.amount;
      a.paid += billPaidAmt(b); // 一部回収も回収済みに算入(未回収残 = 請求額 − 回収済み額)
    });
  });
  var advMonths = Object.keys(adv).sort(function (a, b) { return b.localeCompare(a); })
    .filter(function (ym) { return ui.viewYear === "all" || ym.indexOf(ui.viewYear) === 0; });
  h += '<div class="breakdown"><h3><span class="bill-badge">請</span>立替の月別累計(請求先: '
    + (advAll ? "すべて(全請求先の合算)" : esc(ui.viewClients.join("・"))) + ')</h3>';
  // 預かり残高(2026-07-21改修12): 表示中の請求先ぶんだけ集計する(すべて=全請求先の合算)。
  // 「立替累計 − 回収済み = 未回収残」の式とは無関係の別枠の数字として、4つ目に並べる
  var depSel = depositList(advAll ? null : ui.viewClients);
  var depT = 0;
  depSel.forEach(function (d) { depT += d.amt; });
  var depNamesHtml = depSel.map(function (d) {
    return esc(d.name) + ' ' + esc(yen(d.amt));
  }).join(' / ');
  if (advMonths.length === 0) {
    h += '<div style="font-size:14px;color:var(--sub);font-weight:700;">'
      + (advAll ? "立替(請求分)を入れた記帳はまだありません" : "選択中の取引先への請求(立替)はまだありません") + '</div>';
    if (depT > 0) {
      h += '<div class="dep-line"><span class="dep-badge" aria-hidden="true">預</span>預かり残高 <span class="v">'
        + esc(yen(depT)) + '</span>(' + depNamesHtml + ')</div>';
    }
  } else {
    var advT = 0, advP = 0;
    advMonths.forEach(function (ym) {
      var a = adv[ym];
      advT += a.total;
      advP += a.paid;
      h += '<div class="row"><span style="font-weight:800;">' + esc(monthLabel(ym)) + '</span>'
        + '<span class="val num" style="font-size:14px;">立替累計 ' + esc(yen(a.total))
        + '・回収済み ' + esc(yen(a.paid))
        + '・未回収残 ' + esc(yen(a.total - a.paid)) + '</span></div>';
    });
    h += '<div class="total"><span>合計</span><span class="val num" style="font-size:14px;">立替累計 ' + esc(yen(advT))
      + '・回収済み ' + esc(yen(advP))
      + '・未回収残 ' + esc(yen(advT - advP))
      + '・預かり残高 ' + esc(yen(depT)) + '</span></div>';
    if (depT > 0) {
      h += '<div class="dep-line"><span class="dep-badge" aria-hidden="true">預</span>預かり残高の内訳 ' + depNamesHtml + '</div>';
    }
    h += '<div style="font-size:13px;color:var(--sub);font-weight:700;">未回収残 = 立替累計 − 回収済み。回収してもしなくても、経費の集計(自分負担)には影響しません。<br>'
      + '<strong>預かり残高</strong>は多めに受け取った分(全期間)で、この式とは<strong>別枠</strong>です。未回収残からは差し引きません(自動では次の立替に充てません)。</div>';
  }
  h += '</div>';
  el.innerHTML = h;
}

// 月ページ切替(2026-07-21改修C): 「◀ 前の月 | 2026年7月 | 次の月 ▶」+月一覧。months は新しい順
function monthNavHtml(months, cur, act) {
  var idx = months.indexOf(cur);
  var newer = idx > 0 ? months[idx - 1] : null;
  var older = idx < months.length - 1 ? months[idx + 1] : null;
  var h = '<div class="month-nav">'
    + '<button class="nav"' + (older ? ' data-act="' + act + '" data-name="' + esc(older) + '"' : ' disabled') + '>◀ 前の月</button>'
    + '<span class="cur">' + esc(monthLabel(cur)) + '</span>'
    + '<button class="nav"' + (newer ? ' data-act="' + act + '" data-name="' + esc(newer) + '"' : ' disabled') + '>次の月 ▶</button>'
    + '</div>';
  if (months.length > 1) {
    h += '<div class="tabs month-list">' + months.map(function (m) {
      return '<button class="tab' + (m === cur ? " on" : "") + '" data-act="' + act + '" data-name="' + esc(m) + '">' + esc(monthLabel(m)) + '</button>';
    }).join("") + '</div>';
  }
  return h;
}

                : '')

                ? (ui.editNeg.sum > 0 ? "請求を消して回収として保存する" : "回収として保存する")

              + '<button class="stop" data-act="save-edit-neg-cancel">やめる</button></div>'

          + '<button class="cancel" data-act="cancel-edit">やめる</button></div>'
          + '</div>';
      } else if (ui.expandedId === e.id) {
        h += '<div class="entry-quick">'
          + catSelectHtml(e.category, 'data-change="entry-cat"' + did + catClassAttr(e.category))

          + '<button class="mini-btn-shu" data-act="delete-entry"' + did + '>削除</button>'
          + '</div>';
      }
      h += '</div>';
    });
    h += '</div></section>';
  });
  el.innerHTML = h;
}

// 請求の明細(2026-07-21改修A: bills の1件=1明細)。d = {e: 記帳, b: 請求1件, ix: bills内の位置}
function billDetails() {
  var out = [];
  state.entries.forEach(function (e) {
    (Array.isArray(e.bills) ? e.bills : []).forEach(function (b, ix) {
      out.push({ e: e, b: b, ix: ix });
    });
  });
  return out;
}
// 請求先ブロックに出す預かり残高の1行(2026-07-21改修12)。残高0のときは何も出さない。
// 取引先名と金額を必ず文字で書く(色だけに頼らない=三重符号化)。未回収残とは別枠の数字
function depLineHtml(name) {
  var amt = depositOf(name);
  if (amt <= 0) return "";
  return '<div class="dep-line"><span class="dep-badge" aria-hidden="true">預</span>'
    + esc(cleanBillName(name)) + 'の預かり残高 <span class="v">' + esc(yen(amt)) + '</span>(次回の立替に使えます)</div>';
}
// 明細を請求先ごとにまとめる(名前順)。to空は「(請求先なし)」に集約
function billGroupsD(list) {
  var m = {};
  list.forEach(function (d) {
    var k = d.b.to || "(請求先なし)";
    (m[k] = m[k] || []).push(d);
  });
  return Object.keys(m).sort().map(function (k) { return { name: k, rows: m[k] }; });
}
// hideDate: 日付見出しの下に並べるとき true(行ごとの日付表示を省く)
function billRowHtmlD(d, paid, hideDate) {
  var subs = [];
  if (!hideDate) subs.push(esc(d.e.date));
  if (paid) subs.push('回収日 ' + esc(d.b.paidDate || "不明"));
  // 出どころの内訳を文字で明記する(2026-07-21改修11-7、改修13-11・検証10 問題5の修正)。
  // 回収記録からの自動充当ぶんと、手動で「回収済みにする」を押して宣言したぶんを混ぜない
  if (paid) {
    var manAmt = billManualAmt(d.b);
    var autoAmt = billPaidAmt(d.b) - manAmt;
    if (autoAmt > 0 && manAmt > 0) subs.push('回収記録から ' + esc(yen(autoAmt)) + '・手動 ' + esc(yen(manAmt)));
    else if (autoAmt > 0 && d.b.paidBy) subs.push('回収記録から自動');
    else if (manAmt > 0) subs.push('手動で回収済み');
  }
  // 一部回収(2026-07-21改修11-8): 請求額と回収済み額を文字で明記し、金額欄は「残り」を出す
  var part = !paid && billPaidAmt(d.b) > 0;
  if (part) subs.push('請求 ' + esc(yen(d.b.amount)) + '・回収済み ' + esc(yen(billPaidAmt(d.b))) + '(一部回収)');
  if (d.e.memo) subs.push(esc(d.e.memo));
  return '<div class="bill-row2">'
    + '<span class="info"><span class="st">' + esc(d.e.store || "(店名なし)") + '</span>'
    + (subs.length ? '<span class="sub">' + subs.join("・") + '</span>' : '')
    + '</span>'
    + '<span class="amt">' + (part ? '残り ' : '') + esc(yen(paid ? d.b.amount : billRemain(d.b))) + '</span>'
    + (paid
      ? '<button class="mini-btn-shu" data-act="bill-unpaid" data-id="' + esc(d.e.id) + '" data-bidx="' + d.ix + '">取り消す</button>'
      : '<button class="mini-btn-ai" data-act="bill-paid" data-id="' + esc(d.e.id) + '" data-bidx="' + d.ix + '">回収済みにする</button>')
    + '</div>';
}

  // 預かり残高(2026-07-21改修12): 多めに受け取った分を取引先ごとに表示するだけ。立替への充当はしない。
  // 未回収残とは別枠の数字なので、上の「未回収合計」からは差し引かない

    h += '<div class="dep-box">'

      + depAll.map(function (d) {
        return '<div class="d-row"><span>' + esc(d.name) + '</span><span class="v">' + esc(yen(d.amt)) + '</span></div>';
      }).join("")
      + '<div class="d-note">相手から多めに受け取った分です。<strong>自動では次の立替に充てません</strong>。次に精算するとき、この残高を見て受け取る額を調整してください。経費でも収入でもないので確定申告には影響しません。</div>'
      + '</div>';
  }
  // 月ページ切替(2026-07-21改修C)。既定はデータのある最新月

  var months = Object.keys(byMonth).sort(function (a, b) { return b.localeCompare(a); });
  var cur = months.indexOf(ui.billsMonth) !== -1 ? ui.billsMonth : months[0];
  h += monthNavHtml(months, cur, "bills-month");
  var list = byMonth[cur];
  var unpaid = list.filter(function (d) { return d.b.status !== "paid"; });
  var paid = list.filter(function (d) { return d.b.status === "paid"; });
  // 未回収の合計は「残り」(請求額−回収済み額)で数える。一部回収した分は回収済み側へ回る
  var unpaidTotal = 0;
  unpaid.forEach(function (d) { unpaidTotal += billRemain(d.b); });
  var paidTotal = 0;
  paid.forEach(function (d) { paidTotal += d.b.amount; });
  unpaid.forEach(function (d) { paidTotal += billPaidAmt(d.b); }); // 一部回収ぶん
  h += '<div class="summary"><span class="label">' + esc(monthLabel(cur)) + 'の未回収</span>'

  var cc = ui.billsCollectConfirm;
  // 月まとめ回収(2026-07-21改修C)
  if (unpaid.length > 0) {
    if (cc && cc.type === "collect" && cc.month === cur) {
      h += '<div class="bulk-confirm">'
        + '<div class="msg"><span class="warn-ic sm">!</span><span><strong>' + esc(monthLabel(cur)) + 'の未回収 ' + unpaid.length + '件・' + esc(yen(unpaidTotal)) + '</strong> をすべて回収済み(回収日=今日)にします。よろしいですか?</span></div>'
        + '<div class="sub">経費の集計(自分負担)には影響しません。</div>'
        + '<div class="row"><button class="go" data-act="bills-collect-go" data-type="collect" data-month="' + esc(cur) + '">回収済みにする</button>'

    }
    billGroupsD(unpaid).forEach(function (g) {
      var sum = 0;
      g.rows.forEach(function (d) { sum += billRemain(d.b); });
      // 未回収の明細は日付ごとに区切る(2026-07-21 ユーザー要望)。日付見出しにその日の小計(整数の足し算のみ)
      var byDate = {};
      g.rows.forEach(function (d) {
        var dt = d.e.date || "(日付なし)";
        (byDate[dt] = byDate[dt] || []).push(d);

      var rowsHtml = Object.keys(byDate).sort().reverse().map(function (dt) {

          : '')
        + '</div>';

  } else {

          + depLineHtml(g.name)
          + g.rows.map(function (d) { return billRowHtmlD(d, true); }).join("")
          + '</div>';
      });
    }
    // 取消(a案・2026-07-21リーダー決定): その月の回収済みを全部未回収に戻す。個別回収分も戻る旨を確認表示に明記

        + '<button class="stop" data-act="bills-collect-stop">やめる</button></div></div>';
    } else {
      h += '<button class="sub-act" data-act="bills-collect-open" data-type="cancel" data-month="' + esc(cur) + '">この月のまとめて回収を取り消す(回収済みを未回収に戻す)</button>';
    }
  }
  h += '</div></div>';
  el.innerHTML = h;
}
