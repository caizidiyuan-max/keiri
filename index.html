<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受注書類アプリ</title>
<style>
  /* ===== 白黒表示でも使える配色: 区別は「太さ・枠・記号」で行う ===== */
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
         margin: 0; background: #f2f2f2; color: #111; line-height: 1.6; }
  .app-ui header { background: #fff; border-bottom: 3px solid #111; padding: 10px 16px;
                   display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
  .app-ui h1 { font-size: 18px; margin: 0; }
  .storage-note { font-size: 12px; }
  #save-indicator { font-size: 12px; margin-left: auto; }
  nav { background: #fff; border-bottom: 1px solid #888; padding: 0 8px;
        display: flex; flex-wrap: wrap; }
  nav button { border: none; background: none; padding: 10px 12px; font-size: 14px;
               cursor: pointer; border-bottom: 4px solid transparent; }
  nav button[aria-current="true"] { font-weight: bold; border-bottom-color: #111; }
  nav button[aria-current="true"]::before { content: "▶ "; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  section.screen { display: none; }
  section.screen.active { display: block; }
  h2 { font-size: 17px; border-left: 6px solid #111; padding-left: 8px; }
  h3 { font-size: 15px; }
  .card { background: #fff; border: 1px solid #777; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  button.btn { border: 1.5px solid #222; background: #fff; padding: 7px 12px; border-radius: 6px;
               cursor: pointer; font-size: 14px; }
  button.btn:hover { background: #eee; }
  button.btn-primary { background: #111; color: #fff; font-weight: bold; }
  button.btn-primary:hover { background: #333; }
  button.btn-small { padding: 3px 8px; font-size: 13px; }
  input[type="text"], input[type="date"], input[type="email"], textarea, select {
      border: 1px solid #555; border-radius: 4px; padding: 6px; font-size: 14px; font-family: inherit; }
  textarea { width: 100%; }
  label { font-size: 13px; font-weight: bold; display: block; margin-top: 8px; }
  .field-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .field-row > div { flex: 1 1 200px; }
  .field-row input { width: 100%; }
  .field-row select { max-width: 100%; }  /* 契約書の条件など、選択肢の文字が長いプルダウンが枠からはみ出さないように */
  .table-scroll { overflow-x: auto; }
  table.ui-table { border-collapse: collapse; width: 100%; background: #fff; }
  table.ui-table th, table.ui-table td { border: 1px solid #555; padding: 6px; font-size: 14px; }
  table.ui-table th { background: #e6e6e6; }
  table.ui-table input { width: 100%; min-width: 60px; border: 1px solid #999; }
  table.ui-table input.num { text-align: right; }
  .error-box { border: 2px solid #000; background: #fff; padding: 8px 10px; font-weight: bold;
               margin: 8px 0; display: none; }
  .error-box.show { display: block; }
  .error-box.ok { border: 3px double #000; }  /* 成功の案内(✓)。警告(⚠・実線枠)と白黒でも区別できる二重枠 */
  .hint { font-size: 12px; color: #333; }
  .notice-box { border: 2px dashed #333; background: #fff; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
  .tap-panel { display: flex; flex-wrap: wrap; gap: 8px; }
  .tap-panel button { border: 1.5px solid #222; background: #fff; border-radius: 8px;
                      padding: 8px 10px; cursor: pointer; font-size: 14px; text-align: left; }
  .tap-panel button:hover { background: #eee; }
  .totals-view { text-align: right; font-size: 15px; margin-top: 8px; }
  .totals-view .grand { font-size: 18px; font-weight: bold; }
  .case-card { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .case-card .case-info { flex: 1 1 260px; }
  .doc-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .doc-tabs button { border: 1.5px solid #222; background: #fff; padding: 6px 12px;
                     border-radius: 6px 6px 0 0; cursor: pointer; }
  .doc-tabs button[aria-current="true"] { background: #111; color: #fff; font-weight: bold; }
  .doc-tabs button[aria-current="true"]::before { content: "▶ "; }
  .term-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }

  /* ===== 書類(A4)の見た目 ===== */
  #print-area { background: #fff; border: 1px solid #888; max-width: 780px; margin: 8px auto;
                padding: 32px 36px; }
  .doc-title { text-align: center; font-size: 24px; letter-spacing: 12px; margin: 0 0 16px; font-weight: bold; }
  .doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .doc-to { font-size: 16px; border-bottom: 1px solid #111; padding-bottom: 2px; min-width: 45%; }
  .doc-meta { font-size: 13px; text-align: right; }
  .doc-lead { margin: 14px 0 6px; font-size: 14px; }
  .doc-subject { font-size: 14px; margin: 4px 0; }
  .doc-amount-box { border: 2px solid #111; display: inline-block; padding: 8px 18px;
                    font-size: 17px; font-weight: bold; margin: 8px 0; }
  table.doc-table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; }
  table.doc-table th, table.doc-table td { border: 1px solid #111; padding: 5px 7px; }
  table.doc-table th { background: #eee; }
  table.doc-table td.num { text-align: right; }
  table.doc-totals { border-collapse: collapse; margin: 8px 0 0 auto; font-size: 13px; }
  table.doc-totals td { border: 1px solid #111; padding: 5px 10px; min-width: 110px; }
  table.doc-totals td.num { text-align: right; }
  table.doc-totals tr.grand td { font-weight: bold; font-size: 14px; }
  .doc-box { border: 1px solid #111; padding: 8px 10px; margin-top: 14px; font-size: 13px; }
  .doc-box h4 { margin: 0 0 4px; font-size: 13px; }
  .doc-issuer { margin-top: 18px; text-align: right; font-size: 13px; }
  .doc-sign { margin-top: 24px; font-size: 13px; }
  .doc-sign .line { border-bottom: 1px solid #111; min-height: 26px; margin: 10px 0; }
  .doc-contract-body { font-size: 13px; white-space: pre-wrap; }
  /* 契約書・使用許諾書の本文は1行=1要素で出す(印刷で条文の途中に改ページが入らないようにするため)。
     見た目は従来の pre-wrap の1枚出しと同じ: 行内の折り返しは pre-wrap、空行は min-height で1行分の高さを保つ */
  .doc-contract-line { white-space: pre-wrap; min-height: 1.6em;
                       page-break-inside: avoid; break-inside: avoid; }
  .doc-footnote { font-size: 11px; margin-top: 12px; }

  @media (max-width: 600px) {
    #print-area { padding: 16px; }
    .doc-head { flex-direction: column; }
    .doc-meta { text-align: left; }
  }

  /* ===== 印刷: 書類だけをA4で出す(画面のボタン類は出さない) ===== */
  @page { size: A4 portrait; margin: 14mm; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%;
                  border: none; margin: 0; padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<div class="app-ui" id="app">
  <header>
    <h1>受注書類アプリ</h1>
    <span class="storage-note">■ データはこの端末の中だけに保存されます(外部への送信なし)</span>
    <span id="save-indicator"></span>
  </header>
  <nav id="nav">
    <button data-screen="home">① 案件一覧</button>
    <button data-screen="edit">② 案件の編集(見積づくり)</button>
    <button data-screen="preview">③ 書類プレビュー</button>
    <button data-screen="items">④ 料金表</button>
    <button data-screen="settings">⑤ 設定</button>
  </nav>
  <main>
    <div class="error-box" id="global-error"></div>
    <section class="screen" id="screen-home"></section>
    <section class="screen" id="screen-edit"></section>
    <section class="screen" id="screen-preview"></section>
    <section class="screen" id="screen-items"></section>
    <section class="screen" id="screen-settings"></section>
  </main>
</div>

/* 選択肢の1件を取り出す。保存値が定義に無ければ既定値の行に落とす(壊れたデータでも書類が崩れない) */
function optRow(key, val) {
  const d = CONTRACT_OPTS[key];
  return d.list.filter(x => x[0] === val)[0] || d.list.filter(x => x[0] === d.def)[0] || d.list[0];
}
/* 契約書に印字する文字列(必ず定義テーブル経由) */
function optText(key, val) { return optRow(key, val)[1]; }
/* 案件の契約条件・共通の契約条件を、既定値で穴埋めしたコピーとして取り出す(古いデータ対策) */
function caseContract(c) { return Object.assign({}, DEFAULT_CASE_CONTRACT, (c && c.contract) || {}); }
function contractDefaults() { return Object.assign({}, DEFAULT_CONTRACT_DEFAULTS, state.settings.contractDefaults || {}); }
/* 2026-08-25(高-1b): 支払期日と「支払いの回数・着手金」が第3条の中で食い違う組み合わせを見つける。
   ・全額前払いなのに支払期日が「作業着手前」でない
   ・支払期日が「作業着手前」なのに、分割払い・検収完了後一括を選んでいる
   警告は画面にだけ出す(#print-area の外)。印刷物には出さない */
const PAY_CONFLICT_MSG = '支払期日と「支払いの回数・着手金」が食い違っています。第3条の中で支払いの条件が矛盾するので、どちらかを選び直してください。';
function payConflict(c) {
  const ct = caseContract(c);
  const split = optRow('paySplit', ct.paySplit)[0];
  const due = optRow('payDue', ct.payDue)[0];
  if (split === 'prepaid' && due !== '作業着手前') return true;
  if (due === '作業着手前' && (split === 's5050' || split === 's3070' || split === 'lump')) return true;
  /* 2026-08-25(中-5): 支払期日が「作業着手前」で、回数が「見積書の取引条件のとおり」(既定値)のとき。
     見積書の定型文は「着手時50%・納品時50%」なので、契約書の「着手前に(全額)」と食い違う。
     既定値のままの人に起きるので、いちばん出やすい組み合わせ */
  if (due === '作業着手前' && split === 'quote') return true;
  return false;
}

/* 2026-08-25(高-1・高-3・中-6・中-17・中-22・中-23・第4部#13#16):
   見積書の取引条件(定型文)と契約書の選択が食い違っている組み合わせを、②案件の編集の画面にだけ出す。
   ・見積書の定型文(DEFAULT_TERMS)は変えない方針なので、契約書側の文言(第24条の優先関係)と
     この注意表示の2本立てで解決する。
   ・判定は「その案件の取引条件欄に実際に書かれている文字」を見る(定型文を入れていなければ出さない)。
   ・戻り値は文字列の配列。#print-area の外なので印刷物には出ない */
function termsConflicts(c) {
  /* 契約書を出さないアプリ販売案件(取引条件の系統が別)には、この突き合わせは当てはまらない */
  if (!c || c.type === 'app') return [];
  const ct = caseContract(c);
  const cd = contractDefaults();
  const terms = String((c && c.terms) || '');
  const has = w => terms.indexOf(w) !== -1;
  const msgs = [];
  /* 高-1: 第3条が「見積書の取引条件のとおり」と言っているのに、取引条件に支払いのことが書いていない */
  if (optRow('paySplit', ct.paySplit)[0] === 'quote' && !has('支払')) {
    msgs.push('見積書の取引条件に支払いの回数・着手金のことが書かれていません。このままだと第3条の参照先がありません(第3条により検収完了後の一括払いとして扱われます)。上の「取引条件」に支払いの回数を書くか、ここで「支払いの回数・着手金」を選んでください。');
  }
  /* 高-3: 見積書は「納品時」、契約書の支払期日は検収完了などの別の日 */
  if (optRow('paySplit', ct.paySplit)[0] === 'quote' && has('納品時') &&
      optRow('payDue', ct.payDue)[0] !== '納品後60日以内') {
    msgs.push('見積書の取引条件は「納品時」に支払うと書いていますが、契約書第3条の支払期日は「' +
      optText('payDue', ct.payDue) + '」です。同じ封筒に入る2枚の書類が違う日を指すので、取引条件の文言を契約書に合わせてください(第24条により支払期日は契約書によります)。');
  }
  /* 中-6: 著作権が移る時期を既定(支払完了時)から変えると、見積書の定型文と食い違う */
  if (optRow('copyrightTiming', cd.copyrightTiming)[0] !== 'paid' && has('著作権')) {
    msgs.push('⑤設定の「著作権が相手に移る時期」は既定と違うものを選んでいますが、見積書の取引条件の著作権の文は「代金のお支払い完了時」のままです。著作権が移る日が2通りになります(第24条により契約書が優先します)。取引条件の文言を直すか、⑤設定を「報酬の支払いが完了した時」に戻してください。');
  }
  /* 中-22: 修正回数・超過料金を具体的に選ぶと、見積書の「2回まで・追加費用のご相談」と数字が食い違う */
  if (optRow('revisionCount', ct.revisionCount)[0] !== 'quote' && has('修正')) {
    msgs.push('見積書の取引条件に修正回数が書かれていますが、契約書第6条では「' +
      optRow('revisionCount', ct.revisionCount)[2] + '」を選んでいます。数字や扱いが食い違うおそれがあります(第24条により契約書が優先します)。取引条件の文言を直すか、第6条を「見積書の取引条件のとおり」にしてください。');
  }
  /* 中-23: 契約書は「作業分+取り消せない実費」、見積書は「作業分だけ」 */
  if (has('中止') && !has('実費')) {
    msgs.push('契約書第17条第3項は、中止のとき作業分の報酬に加えて「取り消せない実費」も甲の負担としています。見積書の取引条件のキャンセルの文には実費のことが書かれていないため、請求できる金額が2通りに読めます。取引条件の文言に実費を足してください。');
  }
  /* 中-17: 乙のサーバーを間貸しするのに、見積書の明細にサーバーの費用が無い */
  if (optRow('serverBy', ct.serverBy)[0] === 'otsu-rent' &&
      !has('サーバー') && !((c && c.lines) || []).some(ln => String(ln.itemName || '').indexOf('サーバー') !== -1)) {
    msgs.push('契約書第5条第2項は、貸し出すサーバーの費用を「見積書の明細に記載のとおり」としています。見積書の明細にも取引条件にもサーバーの費用が見当たりません。明細に行を足すか、サーバーの手配の選択を見直してください。');
  }
  /* 第4部#13: 保守契約ありなのに、見積書の取引条件は「貴社にて行っていただきます」 */
  if (optRow('maintenance', ct.maintenance)[0] === 'contract' && has('貴社にて')) {
    msgs.push('契約書第5条は保守・運用を乙(自分)が行うとしていますが、見積書の取引条件の保守の文は「貴社にて行っていただきます」のままです。誰が運用するかが逆になっています。取引条件の文言を直してください。');
  }
  /* 第4部#16: 実績紹介に「掲載しない」のに、見積書の取引条件は「掲載させていただく場合があります」 */
  if (optRow('portfolio', cd.portfolio)[0] === 'ng' && has('実績紹介')) {
    msgs.push('⑤設定の「実績紹介への掲載」は「掲載しない」ですが、見積書の取引条件は掲載する場合があると書いています。正反対の内容です(第24条により契約書が優先します)。取引条件の文言を直してください。');
  }
  return msgs;
}
/* 2026-08-25(中-3/低-1/低-2): 契約書の金額欄(保守の月額・修正の時間単価)の判定。
   1円以上・10けた以内の整数だけを通す。0円や桁あふれは契約の条項として意味をなさないため。
   料金表の単価(isNonNegInt = 0以上)とは別物。料金表側の挙動は変えていない。
   入力時だけでなく印字時にも通すので、外から来た壊れたデータでも「NaN円」が出ない */
function isContractYen(v) {
  const t = String(v == null ? '' : v).trim();
  return /^\d+$/.test(t) && Number(t) >= 1 && Number(t) <= 9999999999;
}

    settings: {
      issuer: { name: '', shopName: '', address: '', tel: '', email: '', invoiceNumber: '', bankInfo: '' },
      tax: { rounding: 'floor' },
      terms: Object.assign({}, DEFAULT_TERMS),
      termsApp: Object.assign({}, DEFAULT_TERMS_APP),
      contractTemplate: DEFAULT_CONTRACT,
      licenseTemplate: DEFAULT_LICENSE,
      /* 契約書の既定条件(全案件に共通。V-10〜V-12・V-15〜V-21)。案件ごとの条件は case.contract 側 */
      contractDefaults: Object.assign({}, DEFAULT_CONTRACT_DEFAULTS),
      /* 2026-08-21廃止: liabilityCapClause / dataLossClause / externalCauseClause / licenseNotes は
         本文の条に編入したため新規データには作らない(旧データの移行は migrateState で行う) */
      /* 「新版に更新されていません」案内のフラグ。旧世代から移行してきて、編集済みのため
         自動更新できなかったひな形・定型文だけ true(→migrateState / renderSettings) */
      updateNotices: { contract: false, license: false, copyright: false },
      numbering: { quote: {}, order: {}, accept: {}, contract: {}, license: {} }
    },
    items: SAMPLE_ITEMS.map(x => Object.assign({}, x)),
    clients: [],   // 取引先マスタ(保存した宛先)。{ id, name } の配列。端末内のみ保存・外部送信なし
    cases: []
  };
}

let state = loadState();
let currentCaseId = state.cases.length ? state.cases[0].id : null;
let currentDocType = 'quote';
let currentScreen = 'home';

/* 保存データ由来の id を許可リスト(英数字・-・_ のみ)で検査し、外れたものは再発行する。
   id は画面のHTML属性に埋め込まれるため、改ざんされたJSONを読み込んでも安全な形だけを通す(XSS対策の入口側) */
function normalizeIds(obj) {
  const okId = /^[A-Za-z0-9_-]{1,40}$/;  // uid() が作る形+余裕
  (obj.items || []).forEach(it => { if (!okId.test(String(it.id))) it.id = uid('it'); });
  (obj.clients || []).forEach(cl => { if (!okId.test(String(cl.id))) cl.id = uid('cl'); });
  (obj.cases || []).forEach(c  => { if (!okId.test(String(c.id)))  c.id  = uid('c'); });
}

/* 古いデータ(拡張前の保存・バックアップ)に新しい項目が無い場合の穴埋め。
   localStorage のキー名(juchu-shorui-v1)と version は変えない。
   拡張前に作った案件は type="web"(Web制作)として今までどおり読めるようにする */
function migrateState(obj) {
  const d = defaultState();
  const hadTermsApp = !!obj.settings.termsApp; // 拡張前データかどうかの目印(サンプル品目の一度きり追加に使う)
  obj.settings.issuer = Object.assign(d.settings.issuer, obj.settings.issuer || {});
  obj.settings.tax = Object.assign(d.settings.tax, obj.settings.tax || {});
  obj.settings.terms = Object.assign(d.settings.terms, obj.settings.terms || {});
  obj.settings.termsApp = Object.assign(d.settings.termsApp, obj.settings.termsApp || {});
  if (!obj.settings.contractTemplate) obj.settings.contractTemplate = d.settings.contractTemplate;
  if (!obj.settings.licenseTemplate) obj.settings.licenseTemplate = d.settings.licenseTemplate;
  /* 契約書の既定条件(2026-08-24追加)。持っていない古いデータ・古いバックアップは既定値で穴埋め */
  obj.settings.contractDefaults = Object.assign(d.settings.contractDefaults, obj.settings.contractDefaults || {});
  /* 【2026-08-21・本文組み込みの移行処理】
     ①ひな形・著作権定型文の自動更新: 過去の既定文(世代リスト)のどれかと一字一句同じ場合に限り、
       新既定文(契約書14条版・使用許諾書12条版・汎用除外入り著作権)へ置き換える。
       ユーザーが編集した文面は勝手に変えない(設定画面に「初期状態に戻すで新版にできます」の案内を出す) */
  if (OLD_CONTRACT_TEMPLATES.indexOf(obj.settings.contractTemplate) !== -1) {
    obj.settings.contractTemplate = DEFAULT_CONTRACT;
  }
  if (OLD_LICENSE_TEMPLATES.indexOf(obj.settings.licenseTemplate) !== -1) {
    obj.settings.licenseTemplate = DEFAULT_LICENSE;
  }
  if (OLD_TERMS_COPYRIGHT.indexOf(obj.settings.terms.copyright) !== -1) {
    obj.settings.terms.copyright = DEFAULT_TERMS.copyright;
  }
  /* ①-2 「新版に更新されていません」案内フラグの穴埋め(→renderSettings)。
     フラグをまだ持たないデータのうち、旧世代の目印(別枠フィールドが残っている/termsAppを持たない拡張前)が
     あるものだけを「旧世代からの移行」と判定し、編集済みで自動更新できなかったひな形・定型文に案内フラグを立てる。
     新版をベースに編集しただけのデータ(目印なし)にはフラグを立てない=案内は出ない。
     旧バックアップJSONの読み込みも同じ判定を通る。※②の削除より前に判定すること(目印が消えるため) */
  if (!obj.settings.updateNotices) {
    const fromOldGen = !hadTermsApp ||
      obj.settings.liabilityCapClause !== undefined || obj.settings.dataLossClause !== undefined ||
      obj.settings.externalCauseClause !== undefined || obj.settings.licenseNotes !== undefined;
    obj.settings.updateNotices = {
      contract: !!(fromOldGen && obj.settings.contractTemplate !== DEFAULT_CONTRACT),
      license: !!(fromOldGen && obj.settings.licenseTemplate !== DEFAULT_LICENSE),
      copyright: !!(fromOldGen && obj.settings.terms.copyright !== DEFAULT_TERMS.copyright)
    };
  } else {
    obj.settings.updateNotices = Object.assign({ contract: false, license: false, copyright: false }, obj.settings.updateNotices);
  }
  /* 【2026-08-25・移行案内の判定を作り直した(低-4/低-5)】
     以前は「手書き記名欄の『印』or 紙2通前提の締め文」(2026-08-22)と「第26条が無ければ旧世代」(2026-08-24)の
     2つで判定していた。後者は、新版の第26条の見出しを書き換えただけで案内が誤って出る問題があったため、
     「旧様式の特徴が1つでも残っていれば旧世代ベース」という形に統一した(既存の2つの目印は残し、
     旧版の最終条だった『第14条(協議・管轄)』を3つ目として追加。→ OLD_CONTRACT_MARKS)。
     この判定はひな形を保存したときにも同じ関数で計算し直す(→renderSettings の #set-contract)。
     文面そのものは1文字も変えない */
  obj.settings.updateNotices.contract = contractNoticeNeeded(obj.settings.contractTemplate);
  /* ②廃止フィールド(旧・別枠条文)の後始末: 値が旧既定文どおり(未編集)ならフィールドごと削除。
       旧既定文と不一致(=ユーザーが編集していた)なら削除せずデータに残し、
       設定画面に「旧・別枠条文(編集済みのため保管)」として読み取り専用で表示する(データを1文字も失わない)。
       旧バックアップJSON(別枠フィールド入り)を読み込んだ場合もここを通るので同じルールで移行される */
  if (obj.settings.liabilityCapClause) {
    const t = obj.settings.liabilityCapClause.text;
    if (!t || LEGACY_LIABILITY_DEFAULTS.indexOf(t) !== -1) delete obj.settings.liabilityCapClause;
  }
  if (obj.settings.dataLossClause) {
    const t = obj.settings.dataLossClause.text;
    if (!t || LEGACY_DATA_LOSS_DEFAULTS.indexOf(t) !== -1) delete obj.settings.dataLossClause;
  }
  if (obj.settings.externalCauseClause) {
    const t = obj.settings.externalCauseClause.text;
    if (!t || LEGACY_EXTERNAL_DEFAULTS.indexOf(t) !== -1) delete obj.settings.externalCauseClause;
  }
  if (obj.settings.licenseNotes) {
    const ln = obj.settings.licenseNotes;
    ['liability', 'aiNoWarranty', 'externalCause'].forEach(k => {
      if (!ln[k] || LEGACY_LICENSE_NOTE_DEFAULTS[k].indexOf(ln[k]) !== -1) delete ln[k];
    });
    if (!ln.liability && !ln.aiNoWarranty && !ln.externalCause) delete obj.settings.licenseNotes;
  }
  obj.settings.numbering = Object.assign(d.settings.numbering, obj.settings.numbering || {});
  (obj.cases || []).forEach(c => {
    if (c.type !== 'web' && c.type !== 'app') c.type = 'web'; // 種類を持たない既存案件はWeb制作として読む
    c.docs = c.docs || {};
    if (!c.docs.license) c.docs.license = { number: '', issueDate: '' };
    /* 契約書の条件(2026-08-24追加)。持っていない古い案件は既定値で穴埋め。
       2026-08-25(低-6): 素のobject以外(文字列・配列・null など)は中身を使わず捨てる。
       文字列のままだと Object.assign が1文字ずつを "0","1","2"… のキーにしてしまうため */
    if (typeof c.contract !== 'object' || c.contract === null || Array.isArray(c.contract)) c.contract = {};
    c.contract = Object.assign({}, DEFAULT_CASE_CONTRACT, c.contract || {});
  });
  /* 取引先マスタ(保存した宛先): clients を持たない旧データ・旧バックアップは空配列で補完
     (案件側は従来どおり clientName に文字列コピーを持つだけなので、他への影響はない) */
  if (!Array.isArray(obj.clients)) obj.clients = [];
  // 品目(料金表)の種類分け: itemType を持たない品目(拡張前からの品目)は "web"(Web制作用)を既定値として補完
  (obj.items || []).forEach(it => {
    if (it.itemType !== 'web' && it.itemType !== 'app' && it.itemType !== 'both') it.itemType = 'web';
  });
  if (!hadTermsApp) {
    // 拡張後の最初の読み込みだけ、アプリ販売用サンプル品目2件を料金表の末尾に足す
    // (以後は termsApp が保存済みになるため、品目を消しても勝手に復活しない)
    let maxSort = obj.items.reduce((m, x) => Math.max(m, x.sort || 0), 0);
    [['メール秘書アプリ 使用許諾(導入設定・30日サポート含む)', 8000],
     ['経理記録アプリ 使用許諾(導入設定・30日サポート含む)', 7000]].forEach(a => {
      obj.items.push({ id: uid('it'), name: a[0], unit: '式', unitPrice: a[1], taxRate: 10, sort: ++maxSort, itemType: 'app' });
    });
  }
  normalizeIds(obj);
  return obj;
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { alertBox('この環境では保存機能が使えません(プライベートモードの可能性)。'); }
  if (!raw) return defaultState();
  try {
    const obj = JSON.parse(raw);
    if (!obj || obj.version !== 1 || !obj.settings || !Array.isArray(obj.items) || !Array.isArray(obj.cases)) throw new Error('形式が違う');
    return migrateState(obj);
  } catch (e) {
    try { localStorage.setItem(KEY + '-broken-' + Date.now(), raw); } catch (e2) {}
    alertBox('保存データが読めなかったため、空の状態で開始しました(壊れたデータは別名で退避済み)。');
    return defaultState();
  }
}

function persist(touchedCase) {
  if (touchedCase) touchedCase.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    const t = new Date();
    document.getElementById('save-indicator').textContent =
      '✓ 保存済み ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0');
  } catch (e) {
    alertBox('保存に失敗しました。バックアップ(設定画面のJSON書き出し)をおすすめします。');
  }
}

/* ================= 共通ヘルパー ================= */
const $ = sel => document.querySelector(sel);
/* ルール: HTML文字列に連結する動的な値は、数値の添字と固定キー以外すべて esc() を通す(id も例外にしない) */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }
function fmt(n) { return Number(n).toLocaleString('ja-JP'); }
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addMonths(iso, m) {
  const p = iso.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const day = d.getDate();
  d.setMonth(d.getMonth() + m);
  if (d.getDate() !== day) d.setDate(0); // 例: 1/31 の1ヶ月後は 2月末日
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
}
function isNonNegInt(v) { return /^\d+$/.test(String(v).trim()); }
/* インボイス登録番号の「よくある入力ゆれ」を自動整形する(全角→半角、空白・ハイフン除去、小文字t→T) */
function normalizeInvoiceNo(v) {
  return v.trim()
    .replace(/[０-９Ｔｔ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)) // 全角→半角
    .replace(/[\s\-ー–—－−‐]/g, '')                                                // 空白・ハイフン類を除去(全角ハイフン－/マイナス−/ハイフン‐も対象)
    .replace(/^t/, 'T');                                                           // 小文字t→大文字T
}
function alertBox(msg) {
  const box = document.getElementById('global-error');
  if (!box) { alert(msg); return; }
  box.textContent = '⚠ ' + msg;
  box.classList.add('show');
  clearTimeout(alertBox._t);
  alertBox._t = setTimeout(() => box.classList.remove('show'), 6000);
}

function getCase(id) { return state.cases.find(c => c.id === id) || null; }
function currentCase() { return getCase(currentCaseId); }

/* ================= 金額計算(すべて整数の円) ================= */
/* 消費税は「書類1枚につき税率ごとに1回」端数処理する(行ごとには処理しない) */
function roundTax(netSum, ratePercent, mode) {
  const x = netSum * ratePercent; // 100倍された税額(整数のまま扱う)
  if (mode === 'round') return Math.floor((x + 50) / 100);
  if (mode === 'ceil') return Math.ceil(x / 100);
  return Math.floor(x / 100); // 既定: 切り捨て
}
function caseTotals(c) {
  const mode = state.settings.tax.rounding;
  const byRate = {};
  let net = 0;
  for (const ln of c.lines) {
    const amount = ln.unitPrice * ln.qty;
    net += amount;
    byRate[ln.taxRate] = (byRate[ln.taxRate] || 0) + amount;
  }
  let tax = 0;
  const taxRows = Object.keys(byRate).map(Number).sort().map(rate => {
    const t = roundTax(byRate[rate], rate, mode);
    tax += t;
    return { rate: rate, net: byRate[rate], tax: t };
  });
  return { net: net, tax: tax, gross: net + tax, taxRows: taxRows, mode: mode };
}
const ROUND_LABEL = { floor: '切り捨て', round: '四捨五入', ceil: '切り上げ' };

/* ================= 書類番号 ================= */
/* 採番時に「既存の全書類の番号」も走査し、カウンタと最大値の大きい方+1にする。
   手入力・JSON読み込み・複製など、どの経路で番号が増えても重複しない(カウンタは戻さない=再利用もしない) */
function assignNumber(type) {
  const year = String(new Date().getFullYear());
  const counters = state.settings.numbering[type];
  let maxUsed = 0;
  const re = new RegExp('^' + year + '-(\\d+)$');   // 2026-3 のような桁ゆれも拾う
  for (const cs of state.cases) {
    const m = re.exec(((cs.docs || {})[type] || {}).number || '');
    if (m) maxUsed = Math.max(maxUsed, parseInt(m[1], 10));
  }
  const next = Math.max(counters[year] || 0, maxUsed) + 1;
  counters[year] = next;                             // カウンタも前進させて保持
  return year + '-' + String(next).padStart(3, '0');
}
/* プレビューを最初に開いた時に番号・日付を入れる(手直し可。カウンタは進んだままなので重複しない) */
function ensureDocMeta(c, type) {
  const doc = c.docs[type];
  let changed = false;
  if (!doc.number) { doc.number = assignNumber(type); changed = true; }
  if (type === 'quote') {
    if (!doc.issueDate) { doc.issueDate = todayStr(); changed = true; }
    if (!doc.expiry) { doc.expiry = addMonths(doc.issueDate, 1); changed = true; }
  } else if (type === 'accept' || type === 'contract' || type === 'license') {
    if (!doc.issueDate) { doc.issueDate = todayStr(); changed = true; }
  }
  // 注文書の注文日は先方が書くため、わざと空欄のまま
  if (changed) persist(c);
}

/* ================= 案件 ================= */
function newCase(type) {
  const c = {
    id: uid('c'),
    type: (type === 'app' ? 'app' : 'web'), // 種類は作成時に決める(作成後は変えられない=定型文の混在事故を防ぐ)
    title: '', clientName: '', lines: [], terms: '', note: '',
    /* 契約書の条件(この案件だけ。V-1〜V-9・V-13・V-14) */
    contract: Object.assign({}, DEFAULT_CASE_CONTRACT),
    docs: { quote: { number: '', issueDate: '', expiry: '' },
            order: { number: '', issueDate: '' },
            accept: { number: '', issueDate: '' },
            contract: { number: '', issueDate: '' },
            license: { number: '', issueDate: '' } },
    updatedAt: new Date().toISOString()
  };
  state.cases.push(c);
  persist();
  return c;
}

/* ================= 画面切替 ================= */
function showScreen(name) {
  currentScreen = name;
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.screen === name ? 'true' : 'false'));
  document.querySelectorAll('section.screen').forEach(s => s.classList.remove('active'));
  $('#screen-' + name).classList.add('active');
  if (name === 'home') renderHome();
  if (name === 'edit') renderEdit();
  if (name === 'preview') renderPreview();
  if (name === 'items') renderItems();
  if (name === 'settings') renderSettings();
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-screen]');
  if (b) showScreen(b.dataset.screen);
});

/* ================= ① 案件一覧 ================= */
function renderHome() {
  const el = $('#screen-home');
  const cases = state.cases.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  let html = '<h2>案件一覧</h2>' +
    '<p><button class="btn btn-primary" data-new="web">+ 新しい案件(Web制作)</button> ' +
    '<button class="btn btn-primary" data-new="app">+ 新しい案件(アプリ販売)</button><br>' +
    '<span class="hint">Web制作=サイト制作の受託(契約書つき・著作権は譲渡)/アプリ販売=秘書アプリ・経理アプリなどの販売(使用許諾書つき・著作権は渡さない)。種類はあとから変えられません</span></p>';
  if (!cases.length) {
    html += '<div class="card">まだ案件がありません。上のボタンから始めてください。<br>' +
            '<span class="hint">流れ: 案件をつくる → 料金表をタップして見積書 → プレビューで印刷(PDF保存)</span></div>';
  }
  for (const c of cases) {
    const t = caseTotals(c);
    const up = (c.updatedAt || '').replace('T', ' ').slice(0, 16);
    html += '<div class="card case-card">' +
      '<div class="case-info"><strong>【' + (CASE_TYPE_LABELS[c.type] || 'Web制作') + '】' + esc(c.title || '(件名未入力)') + '</strong><br>' +
      '<span class="hint">宛先: ' + esc(c.clientName || '(未入力)') + ' / 税込 ' + fmt(t.gross) + '円 / 更新 ' + esc(up) + '</span></div>' +
      '<button class="btn" data-open="' + esc(c.id) + '">開く</button>' +
      '<button class="btn btn-small" data-dup="' + esc(c.id) + '">複製</button>' +
      '<button class="btn btn-small" data-del="' + esc(c.id) + '">削除…</button>' +
      '</div>';
  }
  el.innerHTML = html;
  el.querySelectorAll('button[data-new]').forEach(b => b.onclick = () => {
    const c = newCase(b.dataset.new); currentCaseId = c.id; showScreen('edit');
  });
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { currentCaseId = b.dataset.open; showScreen('edit'); });
  el.querySelectorAll('[data-dup]').forEach(b => b.onclick = () => {
    const src = getCase(b.dataset.dup); if (!src) return;
    const copy = JSON.parse(JSON.stringify(src)); // 種類(type)も複製元から引き継がれる
    copy.id = uid('c');
    copy.title = (src.title || '(件名未入力)') + '(複製)';
    copy.docs = { quote: { number: '', issueDate: '', expiry: '' }, order: { number: '', issueDate: '' },
                  accept: { number: '', issueDate: '' }, contract: { number: '', issueDate: '' },
                  license: { number: '', issueDate: '' } };
    copy.updatedAt = new Date().toISOString();
    state.cases.push(copy); persist(); renderHome();
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const c = getCase(b.dataset.del); if (!c) return;
    if (!confirm('案件「' + (c.title || '(件名未入力)') + '」を削除します。元に戻せません。よろしいですか?')) return;
    state.cases = state.cases.filter(x => x.id !== c.id);
    if (currentCaseId === c.id) currentCaseId = state.cases.length ? state.cases[0].id : null;
    persist(); renderHome();
  });
}

/* ================= ② 案件の編集 ================= */
/* 契約書の条件カード(②案件の編集。Web制作案件だけに出す。→検証レポート V-1〜V-9・V-13・V-14) */
/* 2026-08-25(D-8): 修正回数が「見積書の取引条件のとおり」なのに、その案件の取引条件に
   「修正」の記載が無いとき = 第6条の参照先が無い状態。プルダウンの下に注意を出す */
const REV_QUOTE_WARN_MSG = '見積書の取引条件に修正回数が書かれていません。このままだと第6条の参照先がありません。上の「取引条件」に修正の回数を書くか、ここで回数を選んでください。';
function revQuoteWarnNeeded(c) {
  const ct = caseContract(c);
  return optRow('revisionCount', ct.revisionCount)[0] === 'quote' && String(c.terms || '').indexOf('修正') === -1;
}
/* 取引条件の入力中に、上の注意の出し入れだけを更新する(画面全体は描き直さない) */
function updateRevQuoteWarn(c) {
  const w = document.getElementById('rev-quote-warn');
  if (w) w.style.display = revQuoteWarnNeeded(c) ? '' : 'none';
  const tw = document.getElementById('terms-conflict-warn');
  if (tw) tw.innerHTML = termsConflictHtml(c);
}
/* 見積書の取引条件と契約書の選択の食い違いを、警告の枠として並べたHTML(画面だけ・印刷には出ない) */
function termsConflictHtml(c) {
  return termsConflicts(c).map(m => '<div class="error-box show">⚠ ' + esc(m) + '</div>').join('');
}
function contractCaseCardHtml(c) {
  const ct = caseContract(c);
  const sel = k => contractSelect('ccon', k, ct[k]);
  const dlKey = optRow('deadlineMode', ct.deadlineMode)[0];
  const revKey = optRow('revisionExtra', ct.revisionExtra)[0];
  const revCntKey = optRow('revisionCount', ct.revisionCount)[0];
  const courtKey = optRow('courtMode', ct.courtMode)[0];
  const mntKey = optRow('maintenance', ct.maintenance)[0];
  return '<div class="card"><h3>契約書の条件(この案件だけ)</h3>' +
    '<p class="hint">ここで選んだ内容が「③書類プレビュー」の契約書に入ります。全案件に共通する条件は「⑤設定」で変えられます。</p>' +
    /* 高-1(b): 支払期日と支払いの回数が食い違う組み合わせの警告(画面だけ。印刷には出ない) */
    '<div class="error-box' + (payConflict(c) ? ' show' : '') + '">⚠ ' + esc(PAY_CONFLICT_MSG) + '</div>' +
    /* 中-4: 支払期日「納品後」と支払いの回数「検収完了後」で、数え始める日が2つになる組み合わせ */
    '<div class="error-box' + (payStartConflict(c) ? ' show' : '') + '">⚠ ' + esc(PAY_START_CONFLICT_MSG) + '</div>' +
    /* 高-1・高-3・中-6・中-17・中-22・中-23ほか: 見積書の取引条件と契約書の選択の食い違い(画面だけ)。
       取引条件を書き換えている間も出し入れが追随するよう、id を付けて中身だけ差し替える */
    '<div id="terms-conflict-warn">' + termsConflictHtml(c) + '</div>' +
    '<div class="field-row">' +
    '<div><label>納期(完成予定日)</label>' + sel('deadlineMode') +
      (dlKey === 'date' ? '<input type="date" data-ccon-text="deadlineDate" value="' + esc(ct.deadlineDate) + '">' : '') +
      (dlKey === 'days' ? sel('deadlineDays') : '') + '</div>' +
    '<div><label>検収の期間</label>' + sel('inspectPeriod') + '</div>' +
    '<div><label>連絡がないときのみなし合格</label>' + sel('deemedAccept') +
      '<span class="hint">「なし」にすると、相手が合格の連絡をしない限り検収が完了せず、支払期日の起算日も決まりません。</span></div>' +
    '<div><label>デザイン修正の回数</label>' + sel('revisionCount') +
      '<span class="hint" id="rev-quote-warn"' + (revQuoteWarnNeeded(c) ? '' : ' style="display:none"') + '>' +
      esc(REV_QUOTE_WARN_MSG) + '</span></div>' +
    /* 中-2: 「回数を定めない」ときは「これを超える修正は」が出ないので、この欄自体を隠す */
    (revCntKey === 'free' ? '' :
      '<div><label>修正回数を超えたときの料金</label>' + sel('revisionExtra') +
      (revKey === 'hourly'
        ? '<input type="text" inputmode="numeric" data-ccon-text="revisionHourly" value="' + esc(ct.revisionHourly) + '" placeholder="例: 5000">' +
          '<span class="hint">1時間あたりの金額(円・税別)。空欄のときは「そのつどお見積り」の文になります</span>' : '') + '</div>') +
    '<div><label>支払いの回数・着手金</label>' + sel('paySplit') + '</div>' +
    '<div><label>支払期日</label>' + sel('payDue') +
      '<span class="hint">相手が法人の場合、納品から60日を超える支払期日は避けるのが安全です</span></div>' +
    '<div><label>損害賠償の上限の基準</label>' + sel('capBase') + '</div>' +
    '<div><label>管轄裁判所</label>' + sel('courtMode') +
      (courtKey === 'other'
        ? '<input type="text" data-ccon-text="courtText" value="' + esc(ct.courtText) + '" placeholder="例: 大阪地方裁判所及び大阪簡易裁判所">' +
          '<span class="hint">空欄のときは「乙(自分)の所在地」の裁判所になります</span>' : '') + '</div>' +
    '<div><label>検収後の保守</label>' + sel('maintenance') +
      (mntKey === 'contract'
        ? '<input type="text" inputmode="numeric" data-ccon-text="maintenanceFee" value="' + esc(ct.maintenanceFee) + '" placeholder="例: 5000">' +
          '<span class="hint">保守の月額(円・税別)。空欄のときは「保守契約なし」の文になります</span>' : '') + '</div>' +
    '<div><label>サーバー・ドメインの手配</label>' + sel('serverBy') + '</div>' +
    '</div></div>';
}

/* 契約書の既定条件カード(⑤設定。全案件に共通。→検証レポート V-10〜V-12・V-15〜V-21) */
function contractDefaultsCardHtml() {
  const cd = contractDefaults();
  const rows = [
    ['subcontract', '再委託(外注)の扱い'],
    ['copyrightTiming', '著作権が相手に移る時期'],
    ['portfolio', '実績紹介(ポートフォリオ)への掲載'],
    ['materialDays', '素材の提供を待つ日数'],
    ['lateRate', '支払いが遅れたときの利率'],
    ['claimPeriod', '損害賠償を請求できる期間'],
    ['warrantyPeriod', '納品後に無償で直す期間'],
    ['curePeriod', '契約違反を直すよう求める期間'],
    ['forceMajeureDays', '不可抗力で解除できるまでの日数'],
    ['ndaYears', '秘密保持が契約終了後も続く年数']
  ];
  return '<div class="card"><h3>契約書の既定条件(全案件に共通)</h3>' +
    '<p class="hint">ここで選んだ内容は、すべてのWeb制作案件の契約書に入ります。案件ごとに変わる納期・検収期間・支払期日・管轄裁判所などは「②案件の編集」で選びます。</p>' +
    '<div class="field-row">' +
    rows.map(r => '<div><label>' + r[1] + '</label>' + contractSelect('cdef', r[0], cd[r[0]]) + '</div>').join('') +

function renderEdit() {
  const el = $('#screen-edit');
  const c = currentCase();
  if (!c) {
    el.innerHTML = '<h2>案件の編集</h2><div class="card">案件が選ばれていません。<br>' +
      '<button class="btn btn-primary" data-new2="web">+ 新しい案件(Web制作)</button> ' +
      '<button class="btn btn-primary" data-new2="app">+ 新しい案件(アプリ販売)</button> ' +
      '<button class="btn" id="btn-go-home">案件一覧へ</button></div>';
    el.querySelectorAll('button[data-new2]').forEach(b => b.onclick = () => {
      const nc = newCase(b.dataset.new2); currentCaseId = nc.id; renderEdit();
    });
    $('#btn-go-home').onclick = () => showScreen('home');
    return;
  }
  // 「料金表からタップで追加」パネルには、この案件の種類(c.type)に合う品目(その種類 または「両方」)だけを出す
  // (Web制作案件にアプリ販売専用の品目、逆にアプリ販売案件にWeb制作専用の品目が混在して出てしまう問題への対処)
  const items = state.items.slice().sort((a, b) => a.sort - b.sort)
    .filter(it => it.itemType === c.type || it.itemType === 'both');
  let tapHtml = items.map(it =>
    '<button data-add="' + esc(it.id) + '">+ ' + esc(it.name) + '<br><span class="hint">' + fmt(it.unitPrice) + '円/' + esc(it.unit) + '</span></button>'
  ).join('');
  if (!items.length) {
    if (!state.items.length) {
      tapHtml = '<span class="hint">料金表が空です。「④ 料金表」で品目を登録してください。</span>';
    } else {
      tapHtml = c.type === 'app'
        ? '<span class="hint">アプリ販売用の品目がまだありません。「④ 料金表」で追加するか、種類を「両方」にしてください。</span>'
        : '<span class="hint">Web制作用の品目がまだありません。「④ 料金表」で追加するか、種類を「両方」にしてください。</span>';
    }
  }

  /* 定型文は案件の種類で完全に出し分ける(2系統)。
     アプリ販売案件にWeb制作用「著作権譲渡」の文が入ると、同じアプリを他の顧客に売れなくなるため、
     譲渡ボタン自体を表示せず、「全部挿入」もその種類のセットだけを対象にする */
  const isApp = c.type === 'app';
  const termSrc = isApp ? state.settings.termsApp : state.settings.terms;
  const termLabels = isApp ? TERM_APP_LABELS : TERM_LABELS;
  let termBtns = Object.keys(termLabels).map(k =>
    '<button class="btn btn-small" data-term="' + k + '">挿入: ' + termLabels[k] + '</button>').join('') +
    '<button class="btn btn-small" data-term="__all__">全部挿入</button>';
  const typeNote = isApp
    ? '<div class="notice-box">この案件は【アプリ販売】です。著作権は「譲渡」ではなく<strong>「利用許諾」(使う権利だけを渡す)</strong>の定型文が入ります。' +
      '書類プレビューでは契約書の代わりに<strong>使用許諾書</strong>が出ます。使用許諾書は<strong>見積書と一緒に(ご注文の前から)</strong>お客様にお見せください。</div>'
    : '';

  /* 保存した宛先(取引先マスタ)の呼び出しUI。
     選んでも案件に入るのはただの「文字列コピー」(マスタのidは案件に持たせない)。
     後でマスタ側の名前を変更・削除しても、この案件の宛先欄と書類は一切変わらない(料金表と同じ原則) */
  const clients = state.clients;
  const clientPickHtml = '<div style="margin-top:6px">' +
    (clients.length
      ? '<select id="f-client-select"><option value="">(保存した宛先から選ぶ)</option>' +
        clients.map(cl => '<option value="' + esc(cl.id) + '">' + esc(cl.name) + '</option>').join('') +
        '</select> '
      : '<span class="hint">保存した宛先はまだありません。</span> ') +
    '<button class="btn btn-small" id="btn-save-client" type="button">この宛先を保存</button>' +
    '<br><span class="hint">保存した宛先は「⑤設定」で名前の変更・削除ができます(過去の案件には影響しません)</span></div>';

  el.innerHTML =
    '<h2>案件の編集(見積づくり)― 種類:【' + (CASE_TYPE_LABELS[c.type] || 'Web制作') + '】</h2>' + typeNote +
    '<div class="card"><div class="field-row">' +
    '<div><label>宛先(相手の会社名・お名前)</label><input type="text" id="f-client" value="' + esc(c.clientName) + '" placeholder="例: 株式会社○○">' + clientPickHtml + '</div>' +
    '<div><label>件名</label><input type="text" id="f-title" value="' + esc(c.title) + '" placeholder="例: コーポレートサイト制作一式"></div>' +
    '</div></div>' +
    '<div class="card"><h3>料金表からタップで追加</h3><div class="tap-panel" id="tap-panel">' + tapHtml + '</div></div>' +
    '<div class="error-box" id="edit-error"></div>' +
    '<div class="card"><h3>明細</h3><div class="table-scroll" id="lines-wrap"></div><div class="totals-view" id="totals-view"></div></div>' +
    '<div class="card"><h3>取引条件(見積書に載ります)</h3>' +
    '<div class="term-buttons" id="term-buttons">' + termBtns + '</div>' +
    '<textarea id="f-terms" rows="7" placeholder="上のボタンで定型文を挿入できます(文面は⑤設定で編集できます)">' + esc(c.terms) + '</textarea></div>' +
    (isApp ? '' : contractCaseCardHtml(c)) +   // 契約書の条件はWeb制作案件だけ(アプリ販売案件に契約書タブは出ないため)
    '<div class="card"><h3>備考(見積書に載ります)</h3><textarea id="f-note" rows="3">' + esc(c.note) + '</textarea></div>' +
    '<p><button class="btn btn-primary" id="btn-to-preview">③ 書類プレビューへ進む ▶</button></p>';

  $('#f-client').addEventListener('input', e => { c.clientName = e.target.value; persist(c); });
  /* 保存した宛先から選ぶ(選ぶと宛先欄に文字列コピーが入る。入力済みなら置き換えてよいか確認) */
  const selClient = $('#f-client-select');
  if (selClient) selClient.addEventListener('change', () => {
    const cl = state.clients.find(x => x.id === selClient.value);
    if (!cl) return;
    const cur = $('#f-client').value;
    if (cur.trim() && cur.trim() !== cl.name &&
        !confirm('宛先欄の「' + cur + '」を、保存した宛先「' + cl.name + '」に置き換えます。よろしいですか?')) {
      selClient.value = '';
      return;
    }
    $('#f-client').value = cl.name;
    c.clientName = cl.name;   // 案件には文字列のコピーとして保存(マスタのidは持たせない)
    persist(c);
    selClient.value = '';
  });
  /* いま宛先欄に入っている文字を取引先マスタに保存する(空欄・同名の二重登録は案内して保存しない) */
  $('#btn-save-client').onclick = () => {
    const name = $('#f-client').value.trim();
    if (!name) { editError('宛先が空です。宛先欄に会社名・お名前を入力してから保存してください。'); return; }
    const dup = state.clients.find(x => clientNameKey(x.name) === clientNameKey(name));
    if (dup) { editError('この宛先はすでに「' + dup.name + '」として保存されています(空白の違いだけの名前は同じ宛先とみなし、二重登録できません)。'); return; }
    state.clients.push({ id: uid('cl'), name: name });
    persist();
    renderEdit();   // セレクトに今保存した宛先を反映
    editNotice('宛先「' + name + '」を保存しました(「⑤設定」で変更・削除できます)。', true);
  };
  $('#f-title').addEventListener('input', e => { c.title = e.target.value; persist(c); });
  /* 取引条件を書き換えたら、D-8(修正回数の参照先が無い)の注意の出し入れを更新する */
  $('#f-terms').addEventListener('input', e => { c.terms = e.target.value; persist(c); updateRevQuoteWarn(c); });
  $('#f-note').addEventListener('input', e => { c.note = e.target.value; persist(c); });
  $('#tap-panel').addEventListener('click', e => {
    const b = e.target.closest('button[data-add]'); if (!b) return;
    const it = state.items.find(x => x.id === b.dataset.add); if (!it) return;
    // 品目の「その時点のコピー」を明細に持つ(後で料金表を変えても過去の見積は変わらない)
    c.lines.push({ itemName: it.name, unit: it.unit, unitPrice: it.unitPrice, qty: 1, taxRate: it.taxRate });
    persist(c); renderLines(c);
  });
  $('#term-buttons').addEventListener('click', e => {
    const b = e.target.closest('button[data-term]'); if (!b) return;
    const k = b.dataset.term;
    // 連打・押し直しで同じ定型文が重複しないよう、挿入前に本文を確認する(「・」プレフィックス込みの1行単位で比較)
    // 「全部挿入」もこの案件の種類のセット(termLabels/termSrc)だけが対象
    const candidates = (k === '__all__' ? Object.keys(termLabels) : [k])
      .map(x => '・' + termSrc[x]);
    const ta = $('#f-terms');
    const toAdd = candidates.filter(t => !ta.value.includes(t));
    if (!toAdd.length) { editError('この定型文はすでに挿入されています。'); return; }
    if (toAdd.length < candidates.length) editError('挿入済みの項目はスキップしました。');
    ta.value = (ta.value ? ta.value.replace(/\n*$/, '\n') : '') + toAdd.join('\n') + '\n';
    c.terms = ta.value; persist(c); updateRevQuoteWarn(c);
  });
  /* 契約書の条件(この案件だけ)。プルダウンは自由入力欄の出し分けがあるので描き直す */
  el.querySelectorAll('select[data-ccon]').forEach(sl =>
    sl.addEventListener('change', () => {
      c.contract = caseContract(c);
      c.contract[sl.dataset.ccon] = sl.value;
      /* 高-1(a): 「全額前払い」を選んだとき、支払期日が既定値(検収完了後30日以内)のままなら
         「作業着手前」に合わせる。すでに自分で支払期日を変えている場合は勝手に変えない
         (見積書の有効期限を「自動値のときだけ追随させる」のと同じ考え方) */
      if (sl.dataset.ccon === 'paySplit' && sl.value === 'prepaid' &&
          optRow('payDue', c.contract.payDue)[0] === CONTRACT_OPTS.payDue.def) {
        c.contract.payDue = '作業着手前';
      }
      persist(c); renderEdit();
    }));
  /* 自由入力(納期の日付・裁判所名・修正の時間単価・保守の月額)。
     金額は1以上・10けた以内の整数だけ受け付ける(2026-08-25 中-3/低-1/低-2) */
  el.querySelectorAll('input[data-ccon-text]').forEach(inp =>
    inp.addEventListener('change', () => {
      const k = inp.dataset.cconText, v = inp.value.trim();
      if ((k === 'revisionHourly' || k === 'maintenanceFee') && v && !isContractYen(v)) {
        // 画面全体を描き直すと案内枠(#edit-error)ごと消えてしまうので、この欄だけ元の値に戻す
        inp.value = String(caseContract(c)[k] || '');
        if (!isNonNegInt(v)) editError('金額は 1以上の整数(半角数字)で入力してください。「' + v + '」は使えません。');
        else if (Number(v) < 1) editError('保守の月額・修正の単価は1円以上で入力してください。');
        else editError('金額が大きすぎます。10けた以内で入力してください。');
        return;
      }
      c.contract = caseContract(c);
      c.contract[k] = v;
      persist(c);
    }));
  $('#btn-to-preview').onclick = () => showScreen('preview');
  renderLines(c);
}

/* 案件編集画面の案内枠。ok=true なら成功(✓・二重枠)、それ以外は警告(⚠・実線枠)。
   白黒表示でも記号・枠の種類・文言で区別できる */
function editNotice(msg, ok) {
  const box = $('#edit-error');
  box.textContent = (ok ? '✓ ' : '⚠ ') + msg;
  box.classList.toggle('ok', !!ok);
  box.classList.add('show');
  clearTimeout(editNotice._t);
  editNotice._t = setTimeout(() => box.classList.remove('show'), 5000);
}
function editError(msg) { editNotice(msg, false); }

/* 宛先の同名チェック用の正規化: 前後の空白を除き、名前の中の空白(全角・半角とも)を詰めて比較する。
   「株式会社 ○○」と「株式会社○○」を同じ名前とみなす(保存・表示する名前自体は入力どおり) */
function clientNameKey(t) { return String(t).replace(/\s+/g, ''); }

function renderLines(c) {
  const wrap = $('#lines-wrap');
  if (!c.lines.length) {
    wrap.innerHTML = '<span class="hint">まだ明細がありません。上の料金表をタップすると1行追加されます。</span>';
  } else {
    let rows = c.lines.map((ln, i) =>
      '<tr>' +
      '<td><input type="text" data-ln="' + i + '" data-f="itemName" value="' + esc(ln.itemName) + '"></td>' +
      '<td style="width:80px"><input type="text" inputmode="numeric" class="num" data-ln="' + i + '" data-f="qty" value="' + esc(ln.qty) + '"></td>' +
      '<td style="width:80px"><input type="text" data-ln="' + i + '" data-f="unit" value="' + esc(ln.unit) + '"></td>' +
      '<td style="width:120px"><input type="text" inputmode="numeric" class="num" data-ln="' + i + '" data-f="unitPrice" value="' + esc(ln.unitPrice) + '"></td>' +
      '<td class="num" style="text-align:right; width:110px">' + fmt(ln.unitPrice * ln.qty) + '円</td>' +
      '<td style="width:120px; white-space:nowrap">' +
      '<button class="btn btn-small" data-up="' + i + '" title="上へ">↑</button> ' +
      '<button class="btn btn-small" data-down="' + i + '" title="下へ">↓</button> ' +
      '<button class="btn btn-small" data-rm="' + i + '" title="削除">✕</button></td>' +
      '</tr>').join('');
    wrap.innerHTML = '<table class="ui-table"><thead><tr><th>品目</th><th>数量</th><th>単位</th><th>単価(円)</th><th>金額</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  const t = caseTotals(c);
  const taxLines = t.taxRows.map(r => '消費税(' + r.rate + '%・' + ROUND_LABEL[t.mode] + '): ' + fmt(r.tax) + '円').join('<br>');
  $('#totals-view').innerHTML =
    '税抜合計: ' + fmt(t.net) + '円<br>' + (taxLines || '消費税: 0円') +
    '<br><span class="grand">税込合計: ' + fmt(t.gross) + '円</span>' +
    '<br><span class="hint">※消費税は書類1枚につき税率ごとに1回だけ端数処理しています(⑤設定で方式を変更可)</span>';

  wrap.querySelectorAll('input[data-ln]').forEach(inp => {
    inp.addEventListener('change', e => {
      const i = Number(inp.dataset.ln), f = inp.dataset.f, v = inp.value;
      const ln = c.lines[i]; if (!ln) return;
      if (f === 'qty' || f === 'unitPrice') {
        if (!isNonNegInt(v)) {
          editError((f === 'qty' ? '数量' : '単価') + 'は 0以上の整数(半角数字)で入力してください。「' + v + '」は使えません。');
          renderLines(c); return; // 元の値に戻す
        }
        ln[f] = parseInt(v, 10);
        // 数量0は仕様上OK(無償項目の明示などに使える)だが、うっかりに気づけるよう警告だけ出す(入力は受け付ける)
        if (f === 'qty' && ln.qty === 0) {
          editError('数量が0のため金額0円の行になります。不要な行は「✕」で削除できます。');
        }
      } else {
        ln[f] = v;
      }
      persist(c); renderLines(c);
    });
  });
  wrap.querySelectorAll('button[data-rm]').forEach(b => b.onclick = () => {
    c.lines.splice(Number(b.dataset.rm), 1); persist(c); renderLines(c);
  });
  wrap.querySelectorAll('button[data-up]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.up);
    if (i > 0) { [c.lines[i - 1], c.lines[i]] = [c.lines[i], c.lines[i - 1]]; persist(c); renderLines(c); }
  });
  wrap.querySelectorAll('button[data-down]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.down);
    if (i < c.lines.length - 1) { [c.lines[i + 1], c.lines[i]] = [c.lines[i], c.lines[i + 1]]; persist(c); renderLines(c); }
  });
}

/* ================= ③ 書類プレビュー ================= */
const DOC_LABELS = { quote: '見積書', order: '注文書', accept: '注文請書', contract: '契約書', license: '使用許諾書' };
/* 書類タブは案件の種類で出し分ける: Web制作=契約書、アプリ販売=使用許諾書(両方は出さない) */
function docTypesFor(c) {
  return c.type === 'app' ? ['quote', 'order', 'accept', 'license'] : ['quote', 'order', 'accept', 'contract'];
}

function renderPreview() {
  const el = $('#screen-preview');
  const c = currentCase();
  if (!c) {
    el.innerHTML = '<h2>書類プレビュー</h2><div class="card">案件が選ばれていません。<button class="btn" id="btn-go-home2">案件一覧へ</button></div>';
    $('#btn-go-home2').onclick = () => showScreen('home');
    return;
  }
  // 別の種類の案件から切り替えた直後などに、この案件に無い書類タブが選ばれたままなら見積書に戻す
  if (docTypesFor(c).indexOf(currentDocType) === -1) currentDocType = 'quote';
  ensureDocMeta(c, currentDocType);
  const doc = c.docs[currentDocType];

  let metaHtml = '<div class="field-row">' +
    '<div><label>' + DOC_LABELS[currentDocType] + '番号(手直しできます)</label>' +
    '<input type="text" id="m-number" value="' + esc(doc.number) + '">' +
    '<span class="hint">番号の西暦は自動では変わりません。発行日を別の年に直した場合は、番号の西暦も手直ししてください</span></div>';
  if (currentDocType === 'quote') {
    metaHtml += '<div><label>発行日</label><input type="date" id="m-issue" value="' + esc(doc.issueDate) + '"></div>' +
      '<div><label>有効期限(既定: 発行日の1ヶ月後)</label><input type="date" id="m-expiry" value="' + esc(doc.expiry) + '"></div>';
  } else if (currentDocType === 'accept' || currentDocType === 'contract' || currentDocType === 'license') {
    metaHtml += '<div><label>' + (currentDocType === 'contract' ? '契約日' : '発行日') + '</label>' +
      '<input type="date" id="m-issue" value="' + esc(doc.issueDate) + '"></div>';
  } else {
    metaHtml += '<div><span class="hint">注文日と記名欄は、先方が書き込むため空欄にしてあります。</span></div>';
  }
  metaHtml += '</div>';

  let notices = '';
  if (currentDocType === 'contract' && payConflict(c)) {
    /* 高-1(b): 支払期日と支払いの回数の食い違い。#print-area の外なので印刷には出ない */
    notices += '<div class="error-box show">⚠ ' + esc(PAY_CONFLICT_MSG) + '</div>';
  }
  if (currentDocType === 'contract' && payStartConflict(c)) {
    /* 中-4: 支払期日「納品後」と支払いの回数「検収完了後」で数え始める日が2つになる */
    notices += '<div class="error-box show">⚠ ' + esc(PAY_START_CONFLICT_MSG) + '</div>';
  }
  if (currentDocType === 'contract' || currentDocType === 'quote') {
    /* 高-1・高-3・中-6・中-17・中-22・中-23ほか: 見積書の取引条件と契約書の選択の食い違い。
       2枚の書類の突き合わせなので、契約書タブと見積書タブの両方に出す(印刷には出ない) */
    notices += termsConflictHtml(c);
  }
  if (currentDocType === 'contract') {
    notices += '<div class="notice-box"><strong>【必ずお読みください】</strong> このひな形は一般的な参考例です。' +
      '正式に使う前に内容をご自身で確認し、必要に応じて専門家(弁護士など)にご相談ください。文面は「⑤設定」で編集できます。</div>';
    // 2026-08-21改訂: 損害賠償上限・データ消失/誤送信・外部要因の別枠表示は廃止(第11〜13条として本文に印字される)
    // 2026-08-22追加: 電子契約の運用ヒント(画面にだけ表示。#print-area の外なので印刷には出ない)
    notices += '<div class="notice-box">相手から「この内容で合意します」の返信メールをもらって保管しておくと、合意の証拠になります。</div>';
  }
  if (currentDocType === 'license') {
    notices += '<div class="notice-box"><strong>【必ずお読みください】</strong> このひな形は一般的な参考例です。' +
      '正式に使う前に内容をご自身で確認し、必要に応じて専門家(弁護士など)にご相談ください。文面は「⑤設定」で編集できます。</div>';
    notices += '<div class="notice-box"><strong>見せるタイミング</strong> この使用許諾書は、<strong>見積書と一緒に(ご注文の前から)</strong>お客様にお見せください。' +
      'サポート期間などの条件をご注文の後に初めて出すと、「聞いていない」となりやすいためです(このタブは見積の段階から印刷できます)。</div>';
    // 2026-08-21改訂: 賠償上限・AI免責(言い切り形)・外部要因の別枠表示は廃止(第10〜12条として本文に印字される)
  }
  if (currentDocType === 'contract' || currentDocType === 'accept') {
    notices += '<div class="notice-box">紙に印刷して取り交わす場合、収入印紙(税金の印紙)が必要になることがあります。' +
      'PDFのままメール等でやり取りする場合は不要というのが一般的な取り扱いです。紙にする場合は税務署にご確認ください。</div>';
  }

  el.innerHTML =
    '<h2>書類プレビュー ― ' + esc(c.title || '(件名未入力)') + '</h2>' +
    '<div class="doc-tabs" id="doc-tabs">' +
    docTypesFor(c).map(t =>
      '<button data-doc="' + t + '" aria-current="' + (t === currentDocType ? 'true' : 'false') + '">' + DOC_LABELS[t] + '</button>').join('') +
    '</div>' +
    '<div class="card">' + metaHtml + '</div>' + notices +
    '<p><button class="btn btn-primary" id="btn-print">🖨 印刷・PDF保存</button> ' +
    '<button class="btn" id="btn-back-edit">◀ 編集にもどる</button>' +
    '<span class="hint">(印刷画面で「PDFとして保存」を選ぶとPDFになります)</span></p>' +
    '<div id="print-area">' + buildDoc(c, currentDocType) + '</div>';

  $('#doc-tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-doc]'); if (!b) return;
    currentDocType = b.dataset.doc; renderPreview();
  });
  $('#m-number').addEventListener('change', e => { doc.number = e.target.value; persist(c); refreshSheet(c); });
  const mi = $('#m-issue');
  if (mi) mi.addEventListener('change', e => {
    const prevIssue = doc.issueDate;                        // 代入の前に旧発行日を取る(順番が大事)
    const wasAuto = doc.expiry === addMonths(prevIssue, 1); // 期限=旧発行日+1ヶ月なら「自動値のまま」
    doc.issueDate = e.target.value;
    // 期限が自動値のままのときだけ追随させる。手直し済みならユーザーの決めた期限を尊重して変えない
    if (currentDocType === 'quote' && doc.issueDate && wasAuto) {
      doc.expiry = addMonths(doc.issueDate, 1);
    }
    persist(c); renderPreview();
  });
  const me = $('#m-expiry');
  if (me) me.addEventListener('change', e => { doc.expiry = e.target.value; persist(c); refreshSheet(c); });
  $('#btn-print').onclick = () => window.print();
  $('#btn-back-edit').onclick = () => showScreen('edit');
}
function refreshSheet(c) { $('#print-area').innerHTML = buildDoc(c, currentDocType); }

/* ---- 書類の本体(罫線と文字だけで白黒印刷OK) ---- */
function issuerBlock(withBank) {
  const s = state.settings.issuer;
  let lines = [];
  if (s.shopName) lines.push('<strong>' + esc(s.shopName) + '</strong>');
  if (s.name) lines.push(esc(s.name));
  if (s.address) lines.push(esc(s.address));
  if (s.tel) lines.push('TEL: ' + esc(s.tel));
  if (s.email) lines.push('Mail: ' + esc(s.email));
  if (s.invoiceNumber) lines.push('登録番号: ' + esc(s.invoiceNumber)); // 空欄なら印字しない(免税でも使える様式)
  if (withBank && s.bankInfo) lines.push('お振込先: ' + esc(s.bankInfo));
  if (!lines.length) lines.push('(⑤設定で自社情報を入力してください)');
  return '<div class="doc-issuer">' + lines.join('<br>') + '</div>';
}
function linesTable(c) {
  if (!c.lines.length) return '<p class="hint">(明細がありません)</p>';
  const rows = c.lines.map(ln =>
    '<tr><td>' + esc(ln.itemName) + '</td>' +
    '<td class="num">' + fmt(ln.qty) + '</td>' +
    '<td>' + esc(ln.unit) + '</td>' +
    '<td class="num">' + fmt(ln.unitPrice) + '</td>' +
    '<td class="num">' + fmt(ln.unitPrice * ln.qty) + '</td></tr>').join('');
  return '<table class="doc-table"><thead><tr><th>品目</th><th style="width:9%">数量</th>' +
    '<th style="width:9%">単位</th><th style="width:16%">単価(円)</th><th style="width:16%">金額(円)</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}
function totalsTable(c) {
  const t = caseTotals(c);
  const taxRows = t.taxRows.map(r =>
    '<tr><td>消費税(' + r.rate + '%・' + ROUND_LABEL[t.mode] + ')</td><td class="num">' + fmt(r.tax) + '円</td></tr>').join('');
  return '<table class="doc-totals">' +
    '<tr><td>税抜合計</td><td class="num">' + fmt(t.net) + '円</td></tr>' +
    (taxRows || '<tr><td>消費税</td><td class="num">0円</td></tr>') +
    '<tr class="grand"><td>税込合計</td><td class="num">' + fmt(t.gross) + '円</td></tr></table>';
}
function clientTo(c) {
  return '<div class="doc-to">' + esc(c.clientName || '　　　　　　　　') + ' 御中</div>';
}

function buildDoc(c, type) {
  const t = caseTotals(c);
  const doc = c.docs[type];
  const s = state.settings.issuer;
  const myName = s.shopName || s.name || '(自社名未設定)';

  if (type === 'quote') {
    return '<h1 class="doc-title">御見積書</h1>' +
      '<div class="doc-head">' + clientTo(c) +
      '<div class="doc-meta">見積番号: ' + esc(doc.number) + '<br>発行日: ' + esc(fmtDate(doc.issueDate)) +
      '<br>有効期限: ' + esc(fmtDate(doc.expiry)) + '</div></div>' +
      '<p class="doc-lead">下記のとおり、お見積り申し上げます。</p>' +
      '<p class="doc-subject">件名: ' + esc(c.title || '') + '</p>' +
      '<div class="doc-amount-box">御見積金額(税込): ' + fmt(t.gross) + '円</div>' +
      linesTable(c) + totalsTable(c) +
      (c.terms ? '<div class="doc-box"><h4>取引条件</h4>' + nl2br(c.terms) + '</div>' : '') +
      (c.note ? '<div class="doc-box"><h4>備考</h4>' + nl2br(c.note) + '</div>' : '') +
      issuerBlock(true);
  }

  if (type === 'order') {
    const myTo = '<div class="doc-to">' + esc(myName) + ' 御中</div>';
    return '<h1 class="doc-title">注文書</h1>' +
      '<div class="doc-head">' + myTo +
      '<div class="doc-meta">注文書番号: ' + esc(doc.number) + '<br>注文日: 　　　　年　　月　　日</div></div>' +
      '<p class="doc-lead">貴社お見積書(見積番号: ' + esc(c.docs.quote.number || '　　　　') + ')に基づき、下記のとおり注文します。</p>' +
      '<p class="doc-subject">件名: ' + esc(c.title || '') + '</p>' +
      '<div class="doc-amount-box">注文金額(税込): ' + fmt(t.gross) + '円</div>' +
      linesTable(c) + totalsTable(c) +
      '<div class="doc-sign"><strong>注文者(ご記入ください)</strong>' +
      '<div>住所: <div class="line"></div></div>' +
      '<div>会社名: <div class="line"></div></div>' +
      '<div>氏名: <div class="line" style="width:70%; display:inline-block; vertical-align:bottom;"></div></div>' + // 2026-08-22: PDF運用のため「印」を廃止(質問B-1は案(a)採用)

      '</div>' +
      '<p class="doc-footnote">※この注文書は ' + esc(myName) + ' が様式をご用意したものです。ご記入のうえご返送ください。</p>';
  }

  if (type === 'accept') {
    return '<h1 class="doc-title">注文請書</h1>' +
      '<div class="doc-head">' + clientTo(c) +
      '<div class="doc-meta">請書番号: ' + esc(doc.number) + '<br>発行日: ' + esc(fmtDate(doc.issueDate)) + '</div></div>' +
      '<p class="doc-lead">ご注文いただいた下記の内容を、たしかにお請けいたします。</p>' +
      '<p class="doc-subject">件名: ' + esc(c.title || '') +
      (c.docs.quote.number ? '(見積番号: ' + esc(c.docs.quote.number) + ')' : '') + '</p>' +
      '<div class="doc-amount-box">御請負金額(税込): ' + fmt(t.gross) + '円</div>' +
      linesTable(c) + totalsTable(c) + issuerBlock(false);
  }

  if (type === 'license') {
    /* 使用許諾書: 契約書と同じく、ひな形にデータを差し込む「清書」だけを行う(条文は生成しない) */
    let filledLicense = state.settings.licenseTemplate
      .split('{{発行者}}').join(myName)
      .split('{{発行者住所}}').join(s.address || '')
      .split('{{発行者電話}}').join(s.tel || '')
      .split('{{発行者メール}}').join(s.email || '')
      .split('{{宛先}}').join(c.clientName || '　　　　　　')
      .split('{{対象アプリ}}').join(c.title || '　　　　　　')
      .split('{{見積番号}}').join(c.docs.quote.number || '　　　　')
      .split('{{発行日}}').join(fmtDate(doc.issueDate) || '　　　　年　　月　　日')
      .split('{{許諾書番号}}').join(doc.number || '');
    if (s.invoiceNumber) filledLicense += '\n登録番号: ' + s.invoiceNumber;
    return contractBodyHtml(filledLicense);
  }

  /* 契約書: ひな形にデータを差し込む「清書」だけを行う(条文は生成しない)。
     差し込む文字は必ず CONTRACT_OPTS の定義から引く(保存値をそのまま印字しない)。
     自由入力の3か所(裁判所名・修正の時間単価・保守の月額)も、最後の esc(filled) でまとめてエスケープされる */
  const ct = caseContract(c);
  const cd = contractDefaults();
  /* {{登録番号}}(L-1): 登録番号が未設定なら、その差し込みがある行ごと消す(見積書などの「空欄なら印字しない」と同じ扱い)。
     ユーザーがひな形を編集して行を動かしても壊れないよう、行番号ではなく文字列を含む行を探して消す */
  let tpl = state.settings.contractTemplate;
  if (!s.invoiceNumber) {
    tpl = tpl.split('\n').filter(l => l.indexOf('{{登録番号}}') === -1).join('\n');
  }
  /* 納期(V-1): 4つのモード。定義に無いモードは「日付を指定する」として扱う */
  const dlKey = optRow('deadlineMode', ct.deadlineMode)[0];
  let deadline;
  if (dlKey === 'days') deadline = '注文請書の日から' + optText('deadlineDays', ct.deadlineDays) + '以内';
  else if (dlKey === 'tbd' || dlKey === 'blank') deadline = optText('deadlineMode', dlKey);
  else deadline = fmtDate(ct.deadlineDate) || '　　　　年　　月　　日';
  /* 修正超過単価(V-5)・保守(V-13)・管轄裁判所(V-9)は自由入力あり。空のときは既定の文へ落とす。
     2026-08-25(中-3/低-1/低-2): 金額は印字するときにも isContractYen を通す。
     外から来た壊れたデータ("abc" など)でも「NaN円」が出ず、既定の文にフォールバックする */
  const revCntKey = optRow('revisionCount', ct.revisionCount)[0];
  const revKey = optRow('revisionExtra', ct.revisionExtra)[0];
  const revHourly = String(ct.revisionHourly == null ? '' : ct.revisionHourly).trim();
  let revExtra = revKey === 'hourly'
    ? (isContractYen(revHourly) ? 'これを超える修正は、1時間あたり' + fmt(Number(revHourly)) + '円(消費税別)で承ります。' : optText('revisionExtra', 'estimate'))
    : optText('revisionExtra', revKey);
  /* 中-2: 「回数を定めない」ときは「これを超える修正は…」を出さない(何を超えるのか分からない文になるため) */
  if (revCntKey === 'free') revExtra = '';
  /* 2026-08-25(高-6): 第6条の回数に、第4条2項・第16条1項の無償修正は数えないことを書く。
     「回数を定めない」を選んだときは数える回数そのものが無いので、この一文も出さない(日本語が壊れるため) */
  const revExclude = revCntKey === 'free' ? ''
    : 'この回数には、第4条第2項および第16条第1項にもとづく修正(納品物が見積書または契約の内容に合っていないことを直すもの)は含みません。';
  /* 2026-08-25(高-2): 着手金がある選び方のときだけ、着手時の支払期日の一文を出す。
     全額前払い・検収完了後一括には着手時の支払いが無いので出さない(存在しない支払いの期日を書かない) */
  const splitKey = optRow('paySplit', ct.paySplit)[0];
  const advanceDue = (splitKey === 'prepaid' || splitKey === 'lump') ? ''
    : '着手時の支払いについては、乙が着手前に発行する請求書を受け取った日から30日以内に支払います。';
  /* 2026-08-25(低-1): 「再委託しない」を選んだときだけ、続く文が前段のただし書を受けていることを示す */
  const subLead = optRow('subcontract', cd.subcontract)[0] === 'none' ? '前段のただし書により' : '';
  /* 2026-08-25(低-4): 検収期間に「営業日」を選んだときだけ、営業日の数え方と他の期間(暦日)の関係を書く */
  const bizDayNote = String(optText('inspectPeriod', ct.inspectPeriod)).indexOf('営業日') !== -1
    ? 'この期間の「営業日」とは、土曜日・日曜日・国民の祝日および年末年始(12月29日から1月3日まで)を除いた日をいいます。この契約のその他の期間は、すべて暦の日で数えます。'
    : '';
  const mntKey = optRow('maintenance', ct.maintenance)[0];
  const mntFee = String(ct.maintenanceFee == null ? '' : ct.maintenanceFee).trim();
  /* 2026-08-25(中-18): 「別途締結する」保守契約の月額をこの契約書で決めていたので、
     予定額であることと、結ばれないまま1か月たった場合の受け皿を書く */
  const maintenance = (mntKey === 'contract' && isContractYen(mntFee))
    ? '甲乙が別途締結する保守契約(月額 ' + fmt(Number(mntFee)) + '円・消費税別を予定します)により、乙が行います。検収完了の日から1か月以内に保守契約が締結されない場合、この運用は甲の責任と負担で行うものとします。'
    : optText('maintenance', 'none');
  /* D-1: 賠償上限の基準。報酬額を基準にする2つは、契約書の中で上限額が分かるよう実際の金額を添える */
  const capKey = optRow('capBase', ct.capBase)[0];
  const capBase = capKey === 'net' ? 'この契約の報酬額(消費税を除く。' + fmt(t.net) + '円)'
    : capKey === 'gross' ? 'この契約の報酬額(消費税を含む。' + fmt(t.gross) + '円)'
    : optText('capBase', capKey);
  const courtKey = optRow('courtMode', ct.courtMode)[0];
  const courtFree = String(ct.courtText == null ? '' : ct.courtText).trim();
  const court = (courtKey === 'other' && courtFree) ? courtFree
    : optText('courtMode', courtKey === 'other' ? 'otsu' : courtKey);
  const filled = tpl
    .split('{{発注者}}').join(c.clientName || '　　　　　　')
    .split('{{受注者}}').join(myName)
    .split('{{件名}}').join(c.title || '　　　　　　')
    .split('{{税抜金額}}').join(fmt(t.net) + '円')   /* 低-7: 第11条の上限額(税抜)と突き合わせやすいよう第3条に併記 */
    .split('{{税込金額}}').join(fmt(t.gross) + '円')
    .split('{{見積番号}}').join(c.docs.quote.number || '　　　　')
    .split('{{契約日}}').join(fmtDate(doc.issueDate) || '　　　　年　　月　　日')
    .split('{{乙住所}}').join(s.address || '')
    /* 2026-08-22追加: 乙ブロックの自動印字用(設定の自社情報から差し込む。未設定なら空欄で印字) */
    .split('{{乙氏名}}').join(s.name || '')
    .split('{{乙電話}}').join(s.tel || '')
    .split('{{乙メール}}').join(s.email || '')
    /* 2026-08-24追加: 案件ごとの条件(V-1〜V-9・V-13・V-14) */
    .split('{{納期}}').join(deadline)
    .split('{{検収期間}}').join(optText('inspectPeriod', ct.inspectPeriod))
    .split('{{みなし合格}}').join(optText('deemedAccept', ct.deemedAccept))
    .split('{{営業日の定義}}').join(bizDayNote)      /* 低-4 */
    .split('{{修正回数}}').join(optText('revisionCount', ct.revisionCount))
    .split('{{修正超過単価}}').join(revExtra)
    .split('{{修正回数の除外}}').join(revExclude)    /* 高-6 */
    .split('{{着手金期日}}').join(advanceDue)        /* 高-2 */
    .split('{{支払時期}}').join(optText('paySplit', ct.paySplit))
    .split('{{支払期日}}').join(optText('payDue', ct.payDue))
    .split('{{賠償上限基準}}').join(capBase)
    .split('{{管轄裁判所}}').join(court)
    .split('{{保守}}').join(maintenance)
    .split('{{サーバー手配}}').join(optText('serverBy', ct.serverBy))
    /* 2026-08-24追加: 全案件に共通の条件(V-10〜V-12・V-15〜V-21) */
    .split('{{再委託の可否}}').join(optText('subcontract', cd.subcontract))
    .split('{{再委託の前置き}}').join(subLead)       /* 低-1 */
    .split('{{著作権移転時期}}').join(optText('copyrightTiming', cd.copyrightTiming))
    .split('{{実績掲載}}').join(optText('portfolio', cd.portfolio))
    .split('{{素材待ち日数}}').join(optText('materialDays', cd.materialDays))
    .split('{{遅延利率}}').join(optText('lateRate', cd.lateRate))
    .split('{{賠償請求期間}}').join(optText('claimPeriod', cd.claimPeriod))
    .split('{{無償修正期間}}').join(optText('warrantyPeriod', cd.warrantyPeriod))
    .split('{{是正期間}}').join(optText('curePeriod', cd.curePeriod))
    .split('{{不可抗力日数}}').join(optText('forceMajeureDays', cd.forceMajeureDays))
    .split('{{秘密保持年数}}').join(optText('ndaYears', cd.ndaYears))
    /* 登録番号(L-1): 上で行ごと消していない=登録番号ありのときだけ実際に差し込まれる */
    .split('{{登録番号}}').join(s.invoiceNumber || '');
  return '<div class="doc-meta" style="text-align:right">契約書番号: ' + esc(doc.number) + '</div>' +
    contractBodyHtml(filled);
}

/* D-9(2026-08-25): 契約書・使用許諾書の本文を「1行=1要素」で出す。
   各行に page-break-inside: avoid が効くので、印刷したときに条文の途中でページが分かれない。
   見た目は従来と同じ(行の中の折り返しは white-space: pre-wrap、空行は min-height で1行分の高さを保つ) */
function contractBodyHtml(text) {
  return '<div class="doc-contract-body">' +
    String(text == null ? '' : text).split('\n')
      .map(l => '<div class="doc-contract-line">' + esc(l) + '</div>').join('') +
    '</div>';
}

/* ================= ④ 料金表 ================= */
function renderItems() {
  const el = $('#screen-items');
  const items = state.items.slice().sort((a, b) => a.sort - b.sort);
  // 種類(itemType)はセレクトで選ぶ。既存の data-it / data-f の仕組みに合わせ data-f="itemType" として扱う
  const itemTypeSelect = it => '<select data-it="' + esc(it.id) + '" data-f="itemType">' +
    Object.keys(ITEM_TYPE_LABELS).map(k =>
      '<option value="' + k + '"' + (it.itemType === k ? ' selected' : '') + '>' + ITEM_TYPE_LABELS[k] + '</option>').join('') +
    '</select>';
  let rows = items.map((it, i) =>
    '<tr>' +
    '<td><input type="text" data-it="' + esc(it.id) + '" data-f="name" value="' + esc(it.name) + '"></td>' +
    '<td style="width:90px"><input type="text" data-it="' + esc(it.id) + '" data-f="unit" value="' + esc(it.unit) + '"></td>' +
    '<td style="width:130px"><input type="text" inputmode="numeric" class="num" data-it="' + esc(it.id) + '" data-f="unitPrice" value="' + esc(it.unitPrice) + '"></td>' +
    '<td style="width:110px">' + itemTypeSelect(it) + '</td>' +
    '<td style="width:130px; white-space:nowrap">' +
    '<button class="btn btn-small" data-iup="' + i + '">↑</button> ' +
    '<button class="btn btn-small" data-idown="' + i + '">↓</button> ' +
    '<button class="btn btn-small" data-irm="' + esc(it.id) + '">✕</button></td>' +
    '</tr>').join('');
  el.innerHTML =
    '<h2>料金表(品目マスタ)</h2>' +
    '<div class="notice-box">最初に入っているのは<strong>仮の品目と仮の単価</strong>です。ご自身の料金に直してお使いください。' +
    '単価は<strong>税抜・整数の円</strong>で入力します(税率は10%固定)。' +
    '「種類」は、この品目を Web制作の案件・アプリ販売の案件のどちらで使えるようにするかの区分です(→②案件の編集のタップ追加パネルに反映)。</div>' +
    '<div class="error-box" id="items-error"></div>' +
    '<div class="card"><h3>品目を追加</h3><div class="field-row">' +
    '<div><label>品目名</label><input type="text" id="ni-name" placeholder="例: バナー制作"></div>' +
    '<div><label>単位</label><input type="text" id="ni-unit" placeholder="例: 式 / ページ / 月"></div>' +
    '<div><label>単価(税抜・円)</label><input type="text" inputmode="numeric" id="ni-price" placeholder="例: 10000"></div>' +
    '<div><label>種類</label><select id="ni-type">' +
    Object.keys(ITEM_TYPE_LABELS).map(k => '<option value="' + k + '"' + (k === 'web' ? ' selected' : '') + '>' + ITEM_TYPE_LABELS[k] + '</option>').join('') +
    '</select></div>' +
    '</div><p><button class="btn btn-primary" id="btn-add-item">+ 追加する</button></p></div>' +
    '<div class="card table-scroll"><table class="ui-table"><thead>' +
    '<tr><th>品目名</th><th>単位</th><th>単価(税抜・円)</th><th>種類</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div>';

  function itemsError(msg) {
    const box = $('#items-error');
    box.textContent = '⚠ ' + msg; box.classList.add('show');
    clearTimeout(itemsError._t); itemsError._t = setTimeout(() => box.classList.remove('show'), 5000);
  }
  $('#btn-add-item').onclick = () => {
    const name = $('#ni-name').value.trim(), unit = $('#ni-unit').value.trim() || '式', price = $('#ni-price').value.trim();
    const itemType = $('#ni-type').value;
    if (!name) { itemsError('品目名を入力してください。'); return; }
    if (!isNonNegInt(price)) { itemsError('単価は 0以上の整数(半角数字)で入力してください。'); return; }
    const maxSort = state.items.reduce((m, x) => Math.max(m, x.sort), 0);
    state.items.push({ id: uid('it'), name: name, unit: unit, unitPrice: parseInt(price, 10), taxRate: 10, sort: maxSort + 1,
      itemType: (itemType === 'app' || itemType === 'both') ? itemType : 'web' });
    persist(); renderItems();
  };
  el.querySelectorAll('input[data-it], select[data-it]').forEach(inp => {
    inp.addEventListener('change', () => {
      const it = state.items.find(x => x.id === inp.dataset.it); if (!it) return;
      const f = inp.dataset.f, v = inp.value;
      if (f === 'unitPrice') {
        if (!isNonNegInt(v)) { itemsError('単価は 0以上の整数(半角数字)で入力してください。「' + v + '」は使えません。'); renderItems(); return; }
        it.unitPrice = parseInt(v, 10);
      } else if (f === 'itemType') {
        it.itemType = (v === 'app' || v === 'both') ? v : 'web';
      } else { it[f] = v; }
      persist(); renderItems();
    });
  });
  el.querySelectorAll('button[data-irm]').forEach(b => b.onclick = () => {
    const it = state.items.find(x => x.id === b.dataset.irm); if (!it) return;
    if (!confirm('品目「' + it.name + '」を料金表から削除します。よろしいですか?(作成済みの見積の明細は変わりません)')) return;
    state.items = state.items.filter(x => x.id !== it.id); persist(); renderItems();
  });
  el.querySelectorAll('button[data-iup]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.iup);
    if (i > 0) { const a = items[i - 1].sort; items[i - 1].sort = items[i].sort; items[i].sort = a; persist(); renderItems(); }
  });
  el.querySelectorAll('button[data-idown]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.idown);
    if (i < items.length - 1) { const a = items[i + 1].sort; items[i + 1].sort = items[i].sort; items[i].sort = a; persist(); renderItems(); }
  });
}

/* 旧・別枠条文のうち、ユーザーが編集していたため migrateState が保管した文面の一覧を作る
   (キーは LEGACY_FIELD_LABELS と同じ。licenseNotes は小項目ごと) */
function legacyClauseList(s) {
  const list = [];
  if (s.liabilityCapClause && s.liabilityCapClause.text) list.push({ key: 'liabilityCapClause', text: s.liabilityCapClause.text });
  if (s.dataLossClause && s.dataLossClause.text) list.push({ key: 'dataLossClause', text: s.dataLossClause.text });
  if (s.externalCauseClause && s.externalCauseClause.text) list.push({ key: 'externalCauseClause', text: s.externalCauseClause.text });
  if (s.licenseNotes) {
    ['liability', 'aiNoWarranty', 'externalCause'].forEach(k => {
      if (s.licenseNotes[k]) list.push({ key: 'licenseNotes.' + k, text: s.licenseNotes[k] });
    });
  }
  return list;
}

    '<p class="hint">「②案件の編集」の「この宛先を保存」で保存した宛先の一覧です。' +
    'ここで名前を変更・削除しても、<strong>作成済みの案件の宛先や書類は変わりません</strong>(案件には文字のコピーが保存されるため)。' +
    '宛先はこの端末の中だけに保存され、外部への送信はありません。</p>' +
    (state.clients.length
      ? '<div class="table-scroll"><table class="ui-table"><thead><tr><th>宛先(会社名・お名前)</th><th style="width:110px">操作</th></tr></thead><tbody>' +
        state.clients.map(cl =>
          '<tr><td><input type="text" data-cl="' + esc(cl.id) + '" value="' + esc(cl.name) + '"></td>' +
          '<td style="white-space:nowrap"><button class="btn btn-small" data-cl-del="' + esc(cl.id) + '">削除…</button></td></tr>').join('') +
        '</tbody></table></div>' +
        '<p class="hint">名前を書き換えて欄の外をクリック(またはEnter)すると変更されます。</p>'
      : '<p class="hint">保存した宛先はまだありません。「②案件の編集」の宛先欄のそばにある「この宛先を保存」で追加できます。</p>') +
    '</div>' +
    '<div class="card"><h3>バックアップ</h3>' +
    '<p class="hint">保存先(ブラウザ内)は、ブラウザの履歴・サイトデータ削除で消えることがあります。' +
    '<strong>大事な書類は印刷(PDF保存)+ときどきJSON書き出し</strong>をおすすめします。</p>' +
    '<p><button class="btn" id="btn-export">JSONを書き出す(ダウンロード)</button> ' +
    '<label class="btn" style="display:inline-block">JSONを読み込む(復元)<input type="file" id="file-import" accept=".json,application/json" style="display:none"></label></p>' +
    '</div>';

  el.querySelectorAll('input[data-issuer]').forEach(inp =>
    inp.addEventListener('change', () => {
      let v = inp.value.trim();
      if (inp.dataset.issuer === 'invoiceNumber') {
        // 空欄はOK(免税事業者のまま使える仕様)。入力ゆれを整形し、T+13桁に合わなければ警告のみ(保存は許す)
        const typed = v;
        v = normalizeInvoiceNo(inp.value);
        inp.value = v; // 整形後の値を画面にも反映(勝手に変わったと感じさせないため下の通知も出す)
        if (v && !/^T\d{13}$/.test(v)) {
          alertBox('登録番号は通常「T+数字13桁」です(例: T1234567890123)。お確かめください(入力はこのまま保存されています)。');
        } else if (v && v !== typed) {
          alertBox('登録番号を「' + v + '」に整形して保存しました。');
        }
      }
      s.issuer[inp.dataset.issuer] = v;
      persist();
    }));
  el.querySelectorAll('input[name="rounding"]').forEach(r =>
    r.addEventListener('change', () => { s.tax.rounding = r.value; persist(); }));
  el.querySelectorAll('textarea[data-term-key]').forEach(ta =>
    ta.addEventListener('change', () => {
      s.terms[ta.dataset.termKey] = ta.value;
      if (ta.dataset.termKey === 'copyright' && ta.value === DEFAULT_TERMS.copyright) s.updateNotices.copyright = false; // 手入力で新版と同じ文面になったら案内は不要
      persist();
    }));
  el.querySelectorAll('textarea[data-termapp-key]').forEach(ta =>
    ta.addEventListener('change', () => { s.termsApp[ta.dataset.termappKey] = ta.value; persist(); }));
  /* 契約書の既定条件(全案件に共通) */
  el.querySelectorAll('select[data-cdef]').forEach(sl =>
    sl.addEventListener('change', () => {
      s.contractDefaults = Object.assign({}, DEFAULT_CONTRACT_DEFAULTS, s.contractDefaults || {});
      s.contractDefaults[sl.dataset.cdef] = sl.value;
      persist();
    }));
  $('#set-contract').addEventListener('change', e => {
    s.contractTemplate = e.target.value;
    /* 2026-08-25(低-5): 案内を出すかどうかを保存のたびに計算し直す。
       旧版から新版の全文を手で貼り直した場合(完全一致でなくても旧様式の特徴が消えていれば)案内が消える */
    const before = s.updateNotices.contract;
    s.updateNotices.contract = contractNoticeNeeded(s.contractTemplate);
    persist();
    if (before !== s.updateNotices.contract) renderSettings(); // 案内の出し入れを画面に反映
  });
  $('#btn-reset-contract').onclick = () => {
    if (!confirm('契約書ひな形を初期状態に戻します。編集した内容は消えます。よろしいですか?')) return;
    s.contractTemplate = DEFAULT_CONTRACT; s.updateNotices.contract = false; persist(); renderSettings();
  };
  const btnResetCopyright = $('#btn-reset-copyright');
  if (btnResetCopyright) btnResetCopyright.onclick = () => {
    if (!confirm('取引条件の定型文「著作権」を、汎用部分の除外が入った新しい初期文に置き換えます。いま編集してある「著作権」の文面は消えます。よろしいですか?')) return;
    s.terms.copyright = DEFAULT_TERMS.copyright; s.updateNotices.copyright = false; persist(); renderSettings();
  };
  $('#set-license').addEventListener('change', e => {
    s.licenseTemplate = e.target.value;
    if (s.licenseTemplate === DEFAULT_LICENSE) s.updateNotices.license = false; // 手入力で新版と同じ文面になったら案内は不要
    persist();
  });
  $('#btn-reset-license').onclick = () => {
    if (!confirm('使用許諾書ひな形を初期状態に戻します。編集した内容は消えます。よろしいですか?')) return;
    s.licenseTemplate = DEFAULT_LICENSE; s.updateNotices.license = false; persist(); renderSettings();
  };
  // 旧・別枠条文の保管文の削除(読み取り専用表示なので操作は削除のみ)
  el.querySelectorAll('button[data-legacy-del]').forEach(b => b.onclick = () => {
    const key = b.dataset.legacyDel;
    if (!confirm('保管中の旧・別枠条文「' + (LEGACY_FIELD_LABELS[key] || key) + '」を削除します。元に戻せません。よろしいですか?')) return;
    if (key === 'liabilityCapClause' || key === 'dataLossClause' || key === 'externalCauseClause') {
      delete s[key];
    } else if (key.indexOf('licenseNotes.') === 0 && s.licenseNotes) {
      delete s.licenseNotes[key.slice('licenseNotes.'.length)];
      if (!s.licenseNotes.liability && !s.licenseNotes.aiNoWarranty && !s.licenseNotes.externalCause) delete s.licenseNotes;
    }
    persist(); renderSettings();
  });
  /* 保存した宛先(取引先マスタ)の名前変更・削除。
     どちらも作成済み案件には影響しない(案件側は文字列コピーのため) */
  el.querySelectorAll('input[data-cl]').forEach(inp =>
    inp.addEventListener('change', () => {
      const cl = state.clients.find(x => x.id === inp.dataset.cl); if (!cl) return;
      const name = inp.value.trim();
      if (!name) {
        alertBox('宛先の名前が空です。変更は保存されませんでした(削除する場合は「削除…」を使ってください)。');
        renderSettings(); return;
      }
      const dup = state.clients.find(x => x.id !== cl.id && clientNameKey(x.name) === clientNameKey(name));
      if (dup) {
        alertBox('同じ名前の宛先「' + dup.name + '」がすでにあります(空白の違いだけの名前は同じ宛先とみなします)。変更は保存されませんでした。');
        renderSettings(); return;
      }
      cl.name = name; persist(); renderSettings();
    }));
  el.querySelectorAll('button[data-cl-del]').forEach(b => b.onclick = () => {
    const cl = state.clients.find(x => x.id === b.dataset.clDel); if (!cl) return;
    if (!confirm('保存した宛先「' + cl.name + '」を削除します。作成済みの案件の宛先や書類は変わりません。よろしいですか?')) return;
    state.clients = state.clients.filter(x => x.id !== cl.id);
    persist(); renderSettings();
  });
  $('#btn-export').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '受注書類バックアップ-' + todayStr() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('#file-import').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || obj.version !== 1 || !obj.settings || !Array.isArray(obj.items) || !Array.isArray(obj.cases)) {
          alertBox('このファイルは本アプリのバックアップ形式ではありません。'); return;
        }
        if (!confirm('今のデータを、読み込んだ内容で【上書き】します。よろしいですか?')) return;
        state = migrateState(obj); // 古い形式のバックアップでも読めるよう穴埋め(id検査も内部で実施)
        currentCaseId = state.cases.length ? state.cases[0].id : null;
        persist(); showScreen('home');
        alertBox('バックアップを読み込みました。');
      } catch (err) { alertBox('読み込みに失敗しました: ' + err.message); }
      e.target.value = '';
    };
    reader.readAsText(f);
  });
}

/* ================= 起動 ================= */
showScreen('home');
</script>
</body>
</html>
